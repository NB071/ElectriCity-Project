services:
    mysql:
        image: mysql:8.4
        container_name: electricity-mysql
        restart: unless-stopped
        env_file:
            - ../backend/.env
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
            MYSQL_DATABASE: ${DB_LOCAL_DBNAME}
            MYSQL_USER: ${DB_LOCAL_USER}
            MYSQL_PASSWORD: ${DB_LOCAL_PASSWORD}
        ports:
            - "${MYSQL_PORT:-3306}:3306"
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 60s

    redis:
        image: redis:7-alpine
        container_name: electricity-redis
        restart: unless-stopped
        env_file:
            - ../backend/.env
        command: ["sh", "-c", 'redis-server --requirepass "$$REDIS_PASSWORD"']
        ports:
            - "${REDIS_PORT:-6379}:6379"
        volumes:
            - redis_data:/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG',
                ]
            interval: 10s
            timeout: 5s
            retries: 5

    backend:
        build:
            context: ../backend
            dockerfile: Dockerfile
        container_name: electricity-backend
        restart: unless-stopped
        env_file:
            - ../backend/.env
        environment:
            DB_HOST: mysql
            REDIS_HOST: redis
            LOCAL_ADDRESS: 0.0.0.0
        ports:
            - "${PORT:-5000}:${PORT:-5000}"
        volumes:
            - ../backend:/app
            - backend_node_modules:/app/node_modules
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy

    frontend:
        build:
            context: ../frontend
            dockerfile: Dockerfile
        container_name: electricity-frontend
        restart: unless-stopped
        env_file:
            - ../backend/.env
        environment:
            PORT: "80"
        ports:
            - "3000:80"
        volumes:
            - ../frontend/public:/usr/share/nginx/html:ro
            - ../frontend/nginx/local-proxy.conf:/etc/nginx/templates/default.conf.template:ro
        depends_on:
            - backend

volumes:
    mysql_data:
    redis_data:
    backend_node_modules:
