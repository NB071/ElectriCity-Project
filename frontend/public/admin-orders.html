<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <title>ElectriCity Admin - Orders</title>
        <link
            rel="stylesheet"
            href="/site.css"
        />
    </head>
    <body class="page-wide">
        <nav
            class="history-nav"
            aria-label="Browser history"
        >
            <button
                type="button"
                id="histBack"
            >
                &lt; Back
            </button>
            <button
                type="button"
                id="histForward"
            >
                &gt; Forward
            </button>
        </nav>
        <h1>Admin - Order Oversight &amp; Status Management</h1>
        <p id="status">Checking session...</p>

        <div
            id="adminView"
            hidden
        >
            <div class="panel">
                <h2>All Orders</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Order</th>
                            <th>Owner</th>
                            <th>Items</th>
                            <th>Total</th>
                            <th>Order Status</th>
                            <th>Payment</th>
                            <th>Placed</th>
                            <th>Details</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody"></tbody>
                </table>
                <div class="pagination">
                    <button
                        type="button"
                        id="prevPageBtn"
                    >
                        &laquo; Prev
                    </button>
                    <span id="pageIndicator"></span>
                    <button
                        type="button"
                        id="nextPageBtn"
                    >
                        Next &raquo;
                    </button>
                </div>
                <p
                    class="error"
                    id="listError"
                ></p>
            </div>

            <div
                class="panel"
                id="detailPanel"
                hidden
            >
                <h2 id="detailTitle"></h2>
                <p id="detailOwner"></p>
                <p>
                    Status:
                    <span
                        class="badge"
                        id="detailOrderStatusBadge"
                    ></span>
                    &nbsp;Payment:
                    <span
                        class="badge"
                        id="detailPaymentStatusBadge"
                    ></span>
                </p>
                <p id="detailTotals"></p>

                <h3>Items</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Vehicle</th>
                            <th>Qty</th>
                            <th>Unit Price</th>
                            <th>Line Total</th>
                        </tr>
                    </thead>
                    <tbody id="detailItemsBody"></tbody>
                </table>

                <h3>Addresses</h3>
                <div
                    class="addr-cols"
                    id="detailAddresses"
                ></div>

                <h3>Payment Attempts</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Attempt</th>
                            <th>Method</th>
                            <th>Amount</th>
                            <th>Status</th>
                            <th>When</th>
                        </tr>
                    </thead>
                    <tbody id="detailPaymentsBody"></tbody>
                </table>

                <h3>Update Order Status</h3>
                <div class="status-form">
                    <select id="statusSelect"></select>
                    <button
                        type="button"
                        id="updateStatusBtn"
                    >
                        Update Status
                    </button>
                </div>
                <p
                    class="success"
                    id="statusSuccess"
                ></p>
                <p
                    class="error"
                    id="statusError"
                ></p>
            </div>
        </div>

        <script>
            const isProduction =
                window.location.hostname === "project-electricity.app" ||
                window.location.hostname === "www.project-electricity.app";
            const apiBase = isProduction
                ? "https://api.project-electricity.app"
                : window.location.origin.replace(/\/$/, "");
            const fetchCredentials = isProduction ? "include" : "same-origin";
            let currentPage = 1;
            let currentOrderId = null;

            const ORDER_STATUS_TRANSITIONS = {
                pending: ["confirmed", "cancelled"],
                confirmed: ["shipped", "cancelled"],
                shipped: ["delivered"],
                delivered: [],
                cancelled: [],
            };

            async function apiFetch(path, options = {}) {
                const opts = {
                    credentials: fetchCredentials,
                    headers: {
                        "Content-Type": "application/json",
                        ...(options.headers || {}),
                    },
                    ...options,
                };

                let res = await fetch(apiBase + path, opts);

                if (res.status === 401) {
                    const refreshRes = await fetch(
                        apiBase + "/api/auth/refresh",
                        { method: "POST", credentials: fetchCredentials },
                    );
                    if (refreshRes.ok) {
                        res = await fetch(apiBase + path, opts);
                    }
                }

                const body = await res.json().catch(() => null);
                return { ok: res.ok, status: res.status, body };
            }

            function errorMessage(body, fallback) {
                return body?.data?.message || fallback;
            }

            function formatMoney(amount) {
                return (
                    "$" +
                    Number(amount).toLocaleString(undefined, {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2,
                    })
                );
            }

            function formatDate(value) {
                return value ? new Date(value).toLocaleString() : "*";
            }

            function ownerLabel(row) {
                if (row.user) {
                    return (
                        row.user.first_name +
                        " " +
                        row.user.last_name +
                        " (" +
                        row.user.email +
                        ")"
                    );
                }
                return "Guest: " + (row.guest_email || "unknown");
            }

            // ------- Orders list -------
            async function loadOrders() {
                const listErrorEl = document.getElementById("listError");
                listErrorEl.textContent = "";

                const { ok, body } = await apiFetch(
                    "/api/dashboard/admin/orders?page=" +
                        currentPage +
                        "&limit=10",
                );

                if (!ok) {
                    listErrorEl.textContent = errorMessage(
                        body,
                        "Could not load orders.",
                    );
                    return;
                }

                const { items, pagination } = body.data;
                const tbody = document.getElementById("ordersTableBody");
                tbody.innerHTML = "";

                if (items.length === 0) {
                    tbody.innerHTML =
                        "<tr><td colspan='8'>No orders yet.</td></tr>";
                } else {
                    for (const order of items) {
                        const tr = document.createElement("tr");
                        tr.dataset.orderId = order.order_id;
                        tr.innerHTML =
                            "<td>#" +
                            order.order_id +
                            "</td><td>" +
                            ownerLabel(order) +
                            "</td><td>" +
                            order.item_count +
                            "</td><td>" +
                            formatMoney(order.total) +
                            "</td><td><span class='badge " +
                            order.order_status +
                            "'>" +
                            order.order_status +
                            "</span></td><td><span class='badge " +
                            order.payment_status +
                            "'>" +
                            order.payment_status +
                            "</span></td><td>" +
                            formatDate(order.created_at) +
                            "</td><td><button type='button' class='viewDetailsBtn' data-order-id='" +
                            order.order_id +
                            "'>View details</button></td>";
                        tbody.appendChild(tr);
                    }

                    tbody.querySelectorAll(".viewDetailsBtn").forEach((btn) => {
                        btn.addEventListener("click", () =>
                            loadOrderDetail(Number(btn.dataset.orderId)),
                        );
                    });
                }

                document.getElementById("pageIndicator").textContent =
                    "Page " +
                    pagination.page +
                    " of " +
                    (pagination.totalPages || 1) +
                    " (" +
                    pagination.total +
                    " total)";
                document.getElementById("prevPageBtn").disabled =
                    !pagination.hasPrev;
                document.getElementById("nextPageBtn").disabled =
                    !pagination.hasNext;
            }

            document
                .getElementById("prevPageBtn")
                .addEventListener("click", () => {
                    if (currentPage > 1) {
                        currentPage -= 1;
                        loadOrders();
                    }
                });

            document
                .getElementById("nextPageBtn")
                .addEventListener("click", () => {
                    currentPage += 1;
                    loadOrders();
                });

            // ------- Order detail -------
            function renderStatusSelect(currentStatus) {
                const select = document.getElementById("statusSelect");
                const nextOptions =
                    ORDER_STATUS_TRANSITIONS[currentStatus] || [];

                if (nextOptions.length === 0) {
                    select.innerHTML =
                        "<option value=''>No further transitions from '" +
                        currentStatus +
                        "'</option>";
                    select.disabled = true;
                    document.getElementById("updateStatusBtn").disabled = true;
                    return;
                }

                select.disabled = false;
                document.getElementById("updateStatusBtn").disabled = false;
                select.innerHTML = nextOptions
                    .map(
                        (status) =>
                            "<option value='" +
                            status +
                            "'>" +
                            status +
                            "</option>",
                    )
                    .join("");
            }

            async function loadOrderDetail(orderId) {
                currentOrderId = orderId;
                document.getElementById("statusSuccess").textContent = "";
                document.getElementById("statusError").textContent = "";

                const { ok, body } = await apiFetch(
                    "/api/dashboard/admin/orders/" + orderId,
                );

                const detailPanel = document.getElementById("detailPanel");

                if (!ok) {
                    detailPanel.hidden = false;
                    document.getElementById("detailTitle").textContent =
                        "Could not load order #" + orderId;
                    document.getElementById("detailOwner").textContent =
                        errorMessage(body, "");
                    return;
                }

                const data = body.data;
                detailPanel.hidden = false;
                document.getElementById("detailTitle").textContent =
                    "Order #" + data.order_id;
                document.getElementById("detailOwner").textContent =
                    "Owner: " + ownerLabel(data);

                document.getElementById("detailOrderStatusBadge").className =
                    "badge " + data.order_status;
                document.getElementById("detailOrderStatusBadge").textContent =
                    data.order_status;
                document.getElementById("detailPaymentStatusBadge").className =
                    "badge " + data.payment_status;
                document.getElementById(
                    "detailPaymentStatusBadge",
                ).textContent = data.payment_status;

                document.getElementById("detailTotals").textContent =
                    "Subtotal " +
                    formatMoney(data.subtotal) +
                    " * Tax " +
                    formatMoney(data.tax) +
                    " * Total " +
                    formatMoney(data.total) +
                    " * Placed " +
                    formatDate(data.created_at);

                document.getElementById("detailItemsBody").innerHTML =
                    data.items
                        .map(
                            (item) =>
                                "<tr><td>" +
                                item.catalog_item.name +
                                (item.configuration
                                    ? " (configured #" +
                                      item.configuration.config_id +
                                      ")"
                                    : "") +
                                "</td><td>" +
                                item.quantity +
                                "</td><td>" +
                                formatMoney(item.unit_price) +
                                "</td><td>" +
                                formatMoney(item.line_total) +
                                "</td></tr>",
                        )
                        .join("");

                document.getElementById("detailAddresses").innerHTML =
                    data.addresses
                        .map(
                            (addr) =>
                                "<div><strong>" +
                                addr.address_type +
                                "</strong><br />" +
                                addr.full_name +
                                "<br />" +
                                addr.street +
                                "<br />" +
                                addr.city +
                                ", " +
                                addr.province +
                                " " +
                                addr.postal_code +
                                "<br />" +
                                addr.country +
                                (addr.phone_number
                                    ? "<br />" + addr.phone_number
                                    : "") +
                                "</div>",
                        )
                        .join("");

                document.getElementById("detailPaymentsBody").innerHTML =
                    data.payment_attempts
                        .map(
                            (attempt) =>
                                "<tr><td>#" +
                                attempt.attempt_id +
                                "</td><td>" +
                                attempt.payment_method +
                                "</td><td>" +
                                formatMoney(attempt.amount) +
                                "</td><td><span class='badge " +
                                (attempt.status === "success"
                                    ? "delivered"
                                    : "failed") +
                                "'>" +
                                attempt.status +
                                "</span></td><td>" +
                                formatDate(attempt.attempted_at) +
                                "</td></tr>",
                        )
                        .join("") ||
                    "<tr><td colspan='5'>No payment attempts.</td></tr>";

                renderStatusSelect(data.order_status);
                detailPanel.scrollIntoView({ behavior: "smooth" });
            }

            document
                .getElementById("updateStatusBtn")
                .addEventListener("click", async () => {
                    const statusSuccessEl =
                        document.getElementById("statusSuccess");
                    const statusErrorEl =
                        document.getElementById("statusError");
                    statusSuccessEl.textContent = "";
                    statusErrorEl.textContent = "";

                    const newStatus =
                        document.getElementById("statusSelect").value;
                    if (!newStatus) return;

                    const { ok, body } = await apiFetch(
                        "/api/dashboard/admin/orders/" +
                            currentOrderId +
                            "/status",
                        {
                            method: "PATCH",
                            body: JSON.stringify({ order_status: newStatus }),
                        },
                    );

                    if (!ok) {
                        statusErrorEl.textContent = errorMessage(
                            body,
                            "Could not update order status.",
                        );
                        return;
                    }

                    statusSuccessEl.textContent =
                        "Order status updated to '" + newStatus + "'.";
                    await loadOrderDetail(currentOrderId);
                    await loadOrders();
                });

            async function init() {
                const statusEl = document.getElementById("status");
                const { ok, body } = await apiFetch("/api/auth/me");

                if (!ok || body.data.role !== "admin") {
                    statusEl.innerHTML =
                        'You must be <a href="/auth.html">signed in as an admin</a> to view this page.';
                    return;
                }

                statusEl.textContent = "Signed in as admin: " + body.data.email;
                document.getElementById("adminView").hidden = false;
                await loadOrders();
            }

            init();
        </script>
        <script>
            (function () {
                const backBtn = document.getElementById("histBack");
                const forwardBtn = document.getElementById("histForward");
                if (!backBtn || !forwardBtn) return;

                function syncNav() {
                    // history.length does not expose a forward stack; enable Forward
                    // after the user goes back at least once in this page session.
                    backBtn.disabled = window.history.length <= 1;
                }

                let canForward = false;
                forwardBtn.disabled = true;

                backBtn.addEventListener("click", function () {
                    canForward = true;
                    forwardBtn.disabled = false;
                    window.history.back();
                });
                forwardBtn.addEventListener("click", function () {
                    if (!canForward) return;
                    window.history.forward();
                });
                window.addEventListener("pageshow", syncNav);
                syncNav();
            })();
        </script>
    </body>
</html>
