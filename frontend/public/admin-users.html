<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <title>ElectriCity Admin - Users</title>
        <link
            rel="stylesheet"
            href="/site.css"
        />
    </head>
    <body class="page-mid">
        <nav
            class="history-nav"
            aria-label="Browser history"
        >
            <button
                type="button"
                id="histBack"
            >
                &lt; Back
            </button>
            <button
                type="button"
                id="histForward"
            >
                &gt; Forward
            </button>
        </nav>
        <h1>Admin - User Search &amp; Management</h1>
        <p id="status">Checking session...</p>

        <div
            id="adminView"
            hidden
        >
            <div class="panel">
                <h2>Search Users</h2>
                <div class="search-row">
                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search by name, email, or phone..."
                    />
                    <button
                        type="button"
                        id="searchBtn"
                    >
                        Search
                    </button>
                    <button
                        type="button"
                        id="clearSearchBtn"
                    >
                        Show All
                    </button>
                </div>
                <p class="hint">
                    This is a read-only oversight screen for admins to see all
                    users.
                </p>
                <p
                    class="error"
                    id="searchError"
                ></p>
            </div>

            <div class="panel">
                <h2>Results</h2>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th>Joined</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody"></tbody>
                </table>
                <div class="pagination">
                    <button
                        type="button"
                        id="prevPageBtn"
                    >
                        &laquo; Prev
                    </button>
                    <span id="pageIndicator"></span>
                    <button
                        type="button"
                        id="nextPageBtn"
                    >
                        Next &raquo;
                    </button>
                </div>
            </div>
        </div>

        <script>
            const isProduction =
                window.location.hostname === "project-electricity.app" ||
                window.location.hostname === "www.project-electricity.app";
            const apiBase = isProduction
                ? "https://api.project-electricity.app"
                : window.location.origin.replace(/\/$/, "");
            const fetchCredentials = isProduction ? "include" : "same-origin";
            let currentPage = 1;
            let searchTerm = "";

            async function apiFetch(path) {
                const opts = { credentials: fetchCredentials };
                let res = await fetch(apiBase + path, opts);

                if (res.status === 401) {
                    const refreshRes = await fetch(
                        apiBase + "/api/auth/refresh",
                        { method: "POST", credentials: fetchCredentials },
                    );
                    if (refreshRes.ok) {
                        res = await fetch(apiBase + path, opts);
                    }
                }

                const body = await res.json().catch(() => null);
                return { ok: res.ok, status: res.status, body };
            }

            function errorMessage(body, fallback) {
                return body?.data?.message || fallback;
            }

            function formatDate(value) {
                return value ? new Date(value).toLocaleDateString() : "*";
            }

            function renderUsers(items) {
                const tbody = document.getElementById("usersTableBody");
                tbody.innerHTML = "";

                if (items.length === 0) {
                    tbody.innerHTML =
                        "<tr><td colspan='7'>No users found.</td></tr>";
                    return;
                }

                for (const user of items) {
                    const tr = document.createElement("tr");
                    tr.innerHTML =
                        "<td>" +
                        user.user_id +
                        "</td><td>" +
                        user.full_name +
                        "</td><td>" +
                        user.email +
                        "</td><td>" +
                        (user.phone_number || "-") +
                        "</td><td>" +
                        user.role +
                        "</td><td>" +
                        (user.is_deleted
                            ? '<span class="badge deleted">Deleted</span>'
                            : '<span class="badge active">Active</span>') +
                        "</td><td>" +
                        formatDate(user.created_at) +
                        "</td>";
                    tbody.appendChild(tr);
                }
            }

            async function loadUsers() {
                const searchErrorEl = document.getElementById("searchError");
                searchErrorEl.textContent = "";

                const path = searchTerm
                    ? "/api/dashboard/admin/users/search?q=" +
                      encodeURIComponent(searchTerm) +
                      "&page=" +
                      currentPage +
                      "&limit=10"
                    : "/api/dashboard/admin/users?page=" +
                      currentPage +
                      "&limit=10";

                const { ok, body } = await apiFetch(path);

                if (!ok) {
                    searchErrorEl.textContent = errorMessage(
                        body,
                        "Could not load users.",
                    );
                    document.getElementById("usersTableBody").innerHTML = "";
                    return;
                }

                const { items, pagination } = body.data;
                renderUsers(items);

                document.getElementById("pageIndicator").textContent =
                    "Page " +
                    pagination.page +
                    " of " +
                    (pagination.totalPages || 1) +
                    " (" +
                    pagination.total +
                    " total)";
                document.getElementById("prevPageBtn").disabled =
                    !pagination.hasPrev;
                document.getElementById("nextPageBtn").disabled =
                    !pagination.hasNext;
            }

            document
                .getElementById("searchBtn")
                .addEventListener("click", () => {
                    searchTerm = document
                        .getElementById("searchInput")
                        .value.trim();
                    currentPage = 1;
                    loadUsers();
                });

            document
                .getElementById("searchInput")
                .addEventListener("keydown", (event) => {
                    if (event.key === "Enter") {
                        event.preventDefault();
                        document.getElementById("searchBtn").click();
                    }
                });

            document
                .getElementById("clearSearchBtn")
                .addEventListener("click", () => {
                    searchTerm = "";
                    document.getElementById("searchInput").value = "";
                    currentPage = 1;
                    loadUsers();
                });

            document
                .getElementById("prevPageBtn")
                .addEventListener("click", () => {
                    if (currentPage > 1) {
                        currentPage -= 1;
                        loadUsers();
                    }
                });

            document
                .getElementById("nextPageBtn")
                .addEventListener("click", () => {
                    currentPage += 1;
                    loadUsers();
                });

            async function init() {
                const statusEl = document.getElementById("status");
                const { ok, body } = await apiFetch("/api/auth/me");

                if (!ok || body.data.role !== "admin") {
                    statusEl.innerHTML =
                        'You must be <a href="/auth.html">signed in as an admin</a> to view this page.';
                    return;
                }

                statusEl.textContent = "Signed in as admin: " + body.data.email;
                document.getElementById("adminView").hidden = false;
                await loadUsers();
            }

            init();
        </script>
        <script>
            (function () {
                const backBtn = document.getElementById("histBack");
                const forwardBtn = document.getElementById("histForward");
                if (!backBtn || !forwardBtn) return;

                function syncNav() {
                    // history.length does not expose a forward stack; enable Forward
                    // after the user goes back at least once in this page session.
                    backBtn.disabled = window.history.length <= 1;
                }

                let canForward = false;
                forwardBtn.disabled = true;

                backBtn.addEventListener("click", function () {
                    canForward = true;
                    forwardBtn.disabled = false;
                    window.history.back();
                });
                forwardBtn.addEventListener("click", function () {
                    if (!canForward) return;
                    window.history.forward();
                });
                window.addEventListener("pageshow", syncNav);
                syncNav();
            })();
        </script>
    </body>
</html>
