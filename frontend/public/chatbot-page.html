<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <title>ElectriCity Assistant</title>
        <link
            rel="stylesheet"
            href="/site.css"
        />
    </head>
    <body class="page-chat">
        <nav
            class="history-nav"
            aria-label="Browser history"
        >
            <button
                type="button"
                id="histBack"
            >
                &lt; Back
            </button>
            <button
                type="button"
                id="histForward"
            >
                &gt; Forward
            </button>
        </nav>
        <h1>ElectriCity Assistant</h1>
        <p id="subtitle">Pick a topic, then type your message below.</p>

        <div
            class="panel topics"
            id="topics"
        >
            <h2>Topics</h2>
            <button
                type="button"
                data-template="product-inquiry"
            >
                Shop for a vehicle
            </button>
            <button
                type="button"
                data-template="product-inquiry"
            >
                Compare models
            </button>
            <button
                type="button"
                data-template="product-inquiry"
            >
                Vehicle details &amp; options
            </button>
            <button
                type="button"
                data-template="cart-assist"
            >
                Cart &amp; checkout
            </button>
            <button
                type="button"
                data-template="general-support"
            >
                Help using the site
            </button>
        </div>

        <div
            class="panel"
            id="messages"
        ></div>

        <form
            class="panel composer"
            id="form"
        >
            <h2>Message</h2>
            <input
                id="input"
                type="text"
                placeholder="Type your message..."
                autocomplete="off"
                disabled
            />
            <button
                type="submit"
                id="sendBtn"
                disabled
            >
                Send
            </button>
        </form>

        <script>
            const isProduction =
                window.location.hostname === "project-electricity.app" ||
                window.location.hostname === "www.project-electricity.app";
            const apiBase = isProduction
                ? "https://api.project-electricity.app"
                : window.location.origin.replace(/\/$/, "");
            const fetchCredentials = isProduction ? "include" : "same-origin";

            const TOPIC_GREETINGS = {
                "product-inquiry":
                    "I can help you find vehicles, compare models, and explore options. What are you looking for?",
                "cart-assist":
                    "I can help with your cart and checkout. What do you need?",
                "general-support":
                    "I can help with accounts, navigation, and how the site works. What would you like to know?",
            };

            const topicsEl = document.getElementById("topics");
            const messagesEl = document.getElementById("messages");
            const subtitleEl = document.getElementById("subtitle");
            const formEl = document.getElementById("form");
            const inputEl = document.getElementById("input");
            const sendBtn = document.getElementById("sendBtn");

            let template = null;
            let busy = false;

            function addMessage(text) {
                const line = document.createElement("p");
                line.textContent = text;
                messagesEl.appendChild(line);
                messagesEl.scrollTop = messagesEl.scrollHeight;
            }

            function selectTopic(btn) {
                const chosenTemplate = btn.dataset.template;
                const label = btn.textContent.trim();

                if (template !== chosenTemplate) {
                    template = chosenTemplate;
                    messagesEl.innerHTML = "";
                    addMessage(TOPIC_GREETINGS[chosenTemplate]);
                }

                topicsEl.querySelectorAll("button").forEach(function (b) {
                    b.classList.toggle("selected", b === btn);
                });

                subtitleEl.textContent = "Topic: " + label;
                inputEl.disabled = false;
                sendBtn.disabled = false;
                inputEl.focus();
            }

            topicsEl.addEventListener("click", function (event) {
                const btn = event.target.closest("button[data-template]");
                if (!btn) return;
                selectTopic(btn);
            });

            async function sendMessage(text) {
                if (!text || busy || !template) return;

                busy = true;
                inputEl.disabled = true;
                sendBtn.disabled = true;
                addMessage("You: " + text);
                inputEl.value = "";

                try {
                    const res = await fetch(
                        apiBase + "/api/shop/chatbot/message",
                        {
                            method: "POST",
                            credentials: fetchCredentials,
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                template,
                                userMessage: text,
                            }),
                        },
                    );
                    const body = await res.json();

                    if (!res.ok || !body.success) {
                        const errMsg =
                            body.data?.message ||
                            body.data?.code ||
                            "Something went wrong. Please try again.";
                        addMessage("Error: " + errMsg);
                    } else {
                        addMessage(
                            body.data.reply || "Sorry, I have no reply.",
                        );
                    }
                } catch (err) {
                    addMessage("Could not reach the server. Please try again.");
                } finally {
                    busy = false;
                    inputEl.disabled = false;
                    sendBtn.disabled = false;
                    inputEl.focus();
                }
            }

            formEl.addEventListener("submit", function (event) {
                event.preventDefault();
                sendMessage(inputEl.value.trim());
            });
        </script>
        <script>
            (function () {
                const backBtn = document.getElementById("histBack");
                const forwardBtn = document.getElementById("histForward");
                if (!backBtn || !forwardBtn) return;

                function syncNav() {
                    // history.length does not expose a forward stack; enable Forward
                    // after the user goes back at least once in this page session.
                    backBtn.disabled = window.history.length <= 1;
                }

                let canForward = false;
                forwardBtn.disabled = true;

                backBtn.addEventListener("click", function () {
                    canForward = true;
                    forwardBtn.disabled = false;
                    window.history.back();
                });
                forwardBtn.addEventListener("click", function () {
                    if (!canForward) return;
                    window.history.forward();
                });
                window.addEventListener("pageshow", syncNav);
                syncNav();
            })();
        </script>
    </body>
</html>
