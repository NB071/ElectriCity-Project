<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <title>ElectriCity Promotions</title>
        <link
            rel="stylesheet"
            href="/site.css"
        />
    </head>
    <body class="page-wide">
        <nav
            class="history-nav"
            aria-label="Browser history"
        >
            <button
                type="button"
                id="histBack"
            >
                &lt; Back
            </button>
            <button
                type="button"
                id="histForward"
            >
                &gt; Forward
            </button>
        </nav>
        <h1>ElectriCity Promotions</h1>
        <p id="status">Loading promotions...</p>
        <p>
            <a href="/catalog-browse.html">Full catalog browse</a>
        </p>

        <div class="panel">
            <h2>Promotion Category</h2>
            <p class="hint">
                Optional URL param:
                <strong>?promo=hot_deal|seasonal|clearance|featured</strong>
            </p>
            <p id="promoLinks">
                <a href="/catalog-promotions.html">All promotions</a>
                *
                <a href="/catalog-promotions.html?promo=hot_deal">Hot Deal</a>
                *
                <a href="/catalog-promotions.html?promo=seasonal">Seasonal</a>
                *
                <a href="/catalog-promotions.html?promo=clearance">Clearance</a>
                *
                <a href="/catalog-promotions.html?promo=featured">Featured</a>
            </p>
            <label
                >Sort by
                <select id="fSort">
                    <option value="added_desc">Newest</option>
                    <option value="price_asc">Price: Low to High</option>
                    <option value="price_desc">Price: High to Low</option>
                    <option value="year_desc">Year: Newest</option>
                    <option value="year_asc">Year: Oldest</option>
                    <option value="mileage_asc">Mileage: Low to High</option>
                    <option value="mileage_desc">Mileage: High to Low</option>
                </select>
            </label>
            <button
                type="button"
                id="applySortBtn"
            >
                Apply Sort
            </button>
            <p
                class="success"
                id="cartSuccess"
            ></p>
            <p
                class="error"
                id="cartError"
            ></p>
            <p
                class="error"
                id="listError"
            ></p>
        </div>

        <div class="panel">
            <h2 id="resultsTitle">Results</h2>
            <div id="results"></div>
            <div class="pagination">
                <button
                    type="button"
                    id="prevPageBtn"
                >
                    &laquo; Prev
                </button>
                <span id="pageIndicator"></span>
                <button
                    type="button"
                    id="nextPageBtn"
                >
                    Next &raquo;
                </button>
            </div>
        </div>

        <script>
            const isProduction =
                window.location.hostname === "project-electricity.app" ||
                window.location.hostname === "www.project-electricity.app";
            const apiBase = isProduction
                ? "https://api.project-electricity.app"
                : window.location.origin.replace(/\/$/, "");
            const fetchCredentials = isProduction ? "include" : "same-origin";

            const PROMO_LABELS = {
                hot_deal: "Hot Deal",
                seasonal: "Seasonal",
                clearance: "Clearance",
                featured: "Featured",
            };

            const params = new URLSearchParams(window.location.search);
            let promoFilter = (params.get("promo") || "").trim();
            if (promoFilter && !PROMO_LABELS[promoFilter]) {
                promoFilter = "";
            }

            let currentPage = 1;

            const statusEl = document.getElementById("status");
            const resultsEl = document.getElementById("results");
            const pageIndicatorEl = document.getElementById("pageIndicator");
            const listErrorEl = document.getElementById("listError");
            const cartSuccessEl = document.getElementById("cartSuccess");
            const cartErrorEl = document.getElementById("cartError");

            async function apiFetch(path, options = {}) {
                const headers = {
                    "Content-Type": "application/json",
                    ...(options.headers || {}),
                };
                const opts = {
                    credentials: fetchCredentials,
                    ...options,
                    headers,
                };
                let res = await fetch(apiBase + path, opts);
                const body = await res.json().catch(() => null);
                return { ok: res.ok, status: res.status, body };
            }

            function errorMessage(body, fallback) {
                return body?.data?.message || fallback;
            }

            function formatMoney(amount) {
                return (
                    "$" +
                    Number(amount).toLocaleString(undefined, {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2,
                    })
                );
            }

            function renderPromoBadges(promotions) {
                if (!promotions || promotions.length === 0) return "";
                return promotions
                    .map((promo) => "<span>" + promo.name + "</span>")
                    .join(" * ");
            }

            function bestPromoDiscount(promotions) {
                if (!promotions || promotions.length === 0) return 0;
                return Math.max(
                    ...promotions.map((promo) => promo.discount_amount),
                );
            }

            function currentPromoLabel() {
                return promoFilter
                    ? PROMO_LABELS[promoFilter]
                    : "All promotions";
            }

            async function addToCart(cid) {
                cartErrorEl.textContent = "";
                cartSuccessEl.textContent = "";

                const { ok, body } = await apiFetch("/api/shop/cart/items", {
                    method: "POST",
                    body: JSON.stringify({
                        cid: Number(cid),
                        config_id: null,
                        quantity: 1,
                    }),
                });

                if (!ok) {
                    cartErrorEl.textContent = errorMessage(
                        body,
                        "Could not add that vehicle to your cart.",
                    );
                    return;
                }

                cartSuccessEl.innerHTML =
                    "Added vehicle #" +
                    cid +
                    ' to cart. <a href="/cart.html">Open cart</a>';
            }

            function renderResults(items) {
                resultsEl.innerHTML = "";

                if (items.length === 0) {
                    resultsEl.innerHTML =
                        "<p>No vehicles match this promotion category.</p>";
                    return;
                }

                for (const item of items) {
                    const card = document.createElement("div");
                    card.className = "card";

                    const discount = bestPromoDiscount(item.promotions);
                    const finalPrice = item.base_price - discount;
                    const vehicle = item.vehicle || {};
                    const specs = [
                        vehicle.year,
                        vehicle.condition,
                        vehicle.body_shape,
                        vehicle.drivetrain,
                        vehicle.mileage != null
                            ? vehicle.mileage + " mi"
                            : null,
                    ]
                        .filter(Boolean)
                        .join(" * ");

                    card.innerHTML =
                        '<a href="/catalog-details.html?cid=' +
                        item.id +
                        '">' +
                        '<img src="' +
                        (item.primary_image_url || "") +
                        '" alt="' +
                        item.name +
                        '" onerror="this.style.visibility=\'hidden\'" />' +
                        "<h3>" +
                        item.name +
                        "</h3>" +
                        "</a>" +
                        "<p>" +
                        specs +
                        "</p>" +
                        "<p>" +
                        (discount > 0
                            ? "Was " +
                              formatMoney(item.base_price) +
                              " - Now " +
                              formatMoney(finalPrice)
                            : formatMoney(finalPrice)) +
                        "</p>" +
                        "<p>" +
                        renderPromoBadges(item.promotions) +
                        "</p>" +
                        '<p><button type="button" class="addCartBtn" data-cid="' +
                        item.id +
                        '">Add to cart</button></p>';

                    resultsEl.appendChild(card);
                }

                resultsEl.querySelectorAll(".addCartBtn").forEach((button) => {
                    button.addEventListener("click", () =>
                        addToCart(button.dataset.cid),
                    );
                });
            }

            async function loadResults() {
                listErrorEl.textContent = "";
                statusEl.textContent = "Loading vehicles...";
                document.getElementById("resultsTitle").textContent =
                    currentPromoLabel();

                const query = new URLSearchParams({
                    page: String(currentPage),
                    limit: "12",
                    sort: document.getElementById("fSort").value,
                });
                if (promoFilter) query.set("promo", promoFilter);

                const { ok, body } = await apiFetch(
                    "/api/shop/catalog/vehicles?" + query.toString(),
                );

                if (!ok) {
                    statusEl.textContent = "";
                    listErrorEl.textContent = errorMessage(
                        body,
                        "Could not load promotional vehicles.",
                    );
                    resultsEl.innerHTML = "";
                    return;
                }

                const { items, pagination } = body.data;
                renderResults(items);

                statusEl.textContent =
                    pagination.total +
                    " vehicle(s) for " +
                    currentPromoLabel() +
                    ".";
                pageIndicatorEl.textContent =
                    "Page " +
                    pagination.page +
                    " of " +
                    (pagination.totalPages || 1);
                document.getElementById("prevPageBtn").disabled =
                    !pagination.hasPrev;
                document.getElementById("nextPageBtn").disabled =
                    !pagination.hasNext;
            }

            document
                .getElementById("applySortBtn")
                .addEventListener("click", () => {
                    currentPage = 1;
                    loadResults();
                });

            document
                .getElementById("prevPageBtn")
                .addEventListener("click", () => {
                    if (currentPage > 1) {
                        currentPage -= 1;
                        loadResults();
                    }
                });

            document
                .getElementById("nextPageBtn")
                .addEventListener("click", () => {
                    currentPage += 1;
                    loadResults();
                });

            loadResults();
        </script>
        <script>
            (function () {
                const backBtn = document.getElementById("histBack");
                const forwardBtn = document.getElementById("histForward");
                if (!backBtn || !forwardBtn) return;

                function syncNav() {
                    backBtn.disabled = window.history.length <= 1;
                }

                let canForward = false;
                forwardBtn.disabled = true;

                backBtn.addEventListener("click", function () {
                    canForward = true;
                    forwardBtn.disabled = false;
                    window.history.back();
                });
                forwardBtn.addEventListener("click", function () {
                    if (!canForward) return;
                    window.history.forward();
                });
                window.addEventListener("pageshow", syncNav);
                syncNav();
            })();
        </script>
    </body>
</html>
