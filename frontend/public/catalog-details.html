<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ElectriCity Vehicle Details</title>
        <style>
            body {
                font-family: sans-serif;
                max-width: 860px;
                margin: 2rem auto;
                padding: 0 1rem;
            }
            h1 {
                margin-bottom: 0.25rem;
            }
            a.back {
                font-size: 0.9rem;
            }
            #status {
                color: #555;
            }
            .panel {
                border: 1px solid #ccc;
                border-radius: 6px;
                padding: 1rem 1.25rem;
                margin-bottom: 1.25rem;
            }
            .panel h2 {
                margin-top: 0;
                font-size: 1.1rem;
            }
            .gallery {
                display: flex;
                gap: 0.5rem;
                overflow-x: auto;
                margin-bottom: 1rem;
            }
            .gallery img {
                height: 180px;
                border-radius: 4px;
                background: #eee;
                flex-shrink: 0;
            }
            .price-row {
                font-size: 1.3rem;
                font-weight: bold;
                margin: 0.5rem 0;
            }
            .price-row .original {
                text-decoration: line-through;
                color: #888;
                font-weight: normal;
                font-size: 1rem;
                margin-right: 0.5rem;
            }
            .promo-badge {
                display: inline-block;
                background: #2a7a2a;
                color: white;
                font-size: 0.75rem;
                border-radius: 3px;
                padding: 0.15rem 0.5rem;
                margin-right: 0.3rem;
            }
            .spec-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 0.5rem;
                font-size: 0.9rem;
                margin: 0.75rem 0;
            }
            .spec-grid div span {
                display: block;
                color: #777;
                font-size: 0.75rem;
            }
            .category {
                margin-bottom: 0.75rem;
            }
            .category h3 {
                font-size: 0.95rem;
                margin: 0 0 0.35rem;
            }
            .category label {
                display: block;
                font-size: 0.9rem;
                margin: 0.15rem 0;
            }
            .equipped-list {
                font-size: 0.9rem;
                color: #444;
            }
            button {
                padding: 0.45rem 0.9rem;
                cursor: pointer;
            }
            button + button {
                margin-left: 0.5rem;
            }
            .error {
                color: #c33;
                white-space: pre-wrap;
            }
            .success {
                color: #2a7a2a;
            }
            .review {
                border-bottom: 1px solid #eee;
                padding: 0.6rem 0;
            }
            .review:last-child {
                border-bottom: none;
            }
            .review .meta {
                font-size: 0.8rem;
                color: #777;
            }
            .stars {
                color: #e8a400;
            }
            textarea,
            select,
            input[type="text"] {
                width: 100%;
                box-sizing: border-box;
                padding: 0.4rem;
                margin-top: 0.25rem;
            }
            label.field {
                display: block;
                margin: 0.5rem 0;
                font-size: 0.9rem;
            }
            .lookup-row {
                display: flex;
                gap: 0.5rem;
                align-items: center;
                margin-top: 0.75rem;
            }
            .lookup-row input {
                width: 120px;
            }
            [hidden] {
                display: none !important;
            }
        </style>
    </head>
    <body>
        <p class="back"><a href="/catalog-browse.html">&laquo; Back to catalog</a></p>
        <h1 id="vehicleName">Loading…</h1>
        <p id="status"></p>

        <div class="panel" id="detailsPanel" hidden>
            <div class="gallery" id="gallery"></div>
            <div class="price-row" id="priceRow"></div>
            <div id="promoBadges"></div>
            <p id="description"></p>
            <div class="spec-grid" id="specGrid"></div>
            <p id="historyInfo"></p>
        </div>

        <div class="panel" id="optionsPanel" hidden>
            <h2>Customization Options</h2>
            <div id="customizationCategories"></div>
            <div id="equippedSection" hidden>
                <h3>Equipped / Included Options</h3>
                <div class="equipped-list" id="equippedList"></div>
            </div>
            <button type="button" id="buildConfigBtn">
                Build Configuration
            </button>
            <p class="success" id="configSuccess"></p>
            <p class="error" id="configError"></p>

            <div class="lookup-row">
                <label for="configIdInput">Look up a saved configuration:</label>
                <input type="text" id="configIdInput" placeholder="config ID" />
                <button type="button" id="lookupConfigBtn">Look up</button>
            </div>
            <p class="error" id="lookupError"></p>
        </div>

        <div class="panel">
            <h2>Wishlist</h2>
            <p id="wishlistStatus">Checking…</p>
        </div>

        <div class="panel">
            <h2>Reviews</h2>
            <p id="reviewSummary"></p>
            <div id="reviewsList"></div>
            <div class="lookup-row">
                <button type="button" id="prevReviewsBtn">&laquo; Prev</button>
                <span id="reviewsPageIndicator"></span>
                <button type="button" id="nextReviewsBtn">Next &raquo;</button>
            </div>
        </div>

        <div class="panel" id="writeReviewPanel">
            <h2>Write a Review</h2>
            <div id="reviewFormWrapper" hidden>
                <form id="reviewForm">
                    <label class="field"
                        >Rating
                        <select id="reviewRating">
                            <option value="5">5 - Excellent</option>
                            <option value="4">4 - Good</option>
                            <option value="3">3 - Average</option>
                            <option value="2">2 - Poor</option>
                            <option value="1">1 - Terrible</option>
                        </select>
                    </label>
                    <label class="field"
                        >Title (optional)
                        <input type="text" id="reviewTitle" maxlength="150" />
                    </label>
                    <label class="field"
                        >Review
                        <textarea
                            id="reviewBody"
                            rows="3"
                            maxlength="5000"
                            required
                        ></textarea>
                    </label>
                    <button type="submit">Publish Review</button>
                </form>
                <p class="success" id="reviewSuccess"></p>
                <p class="error" id="reviewError"></p>
            </div>
            <p id="reviewSignInPrompt">
                <a href="/auth.html">Sign in as a customer</a> to write a
                review.
            </p>
        </div>

        <script>
            const apiBase = window.location.origin.replace(/\/$/, "");
            const cid = new URLSearchParams(window.location.search).get("cid");

            let currentUser = null;
            let reviewsPage = 1;
            let customizationCategories = [];

            async function apiFetch(path, options = {}) {
                const opts = {
                    credentials: "same-origin",
                    headers: {
                        "Content-Type": "application/json",
                        ...(options.headers || {}),
                    },
                    ...options,
                };

                let res = await fetch(apiBase + path, opts);

                if (
                    res.status === 401 &&
                    path !== "/api/auth/login" &&
                    path !== "/api/auth/refresh"
                ) {
                    const refreshRes = await fetch(
                        apiBase + "/api/auth/refresh",
                        { method: "POST", credentials: "same-origin" },
                    );
                    if (refreshRes.ok) {
                        res = await fetch(apiBase + path, opts);
                    }
                }

                const body = await res.json().catch(() => null);
                return { ok: res.ok, status: res.status, body };
            }

            function errorMessage(body, fallback) {
                return body?.data?.message || fallback;
            }

            function formatMoney(amount) {
                return (
                    "$" +
                    Number(amount).toLocaleString(undefined, {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2,
                    })
                );
            }

            function starString(rating) {
                return "★".repeat(rating) + "☆".repeat(5 - rating);
            }

            if (!cid) {
                document.getElementById("status").textContent =
                    "No vehicle selected. Go back to the catalog and pick one.";
                document.getElementById("vehicleName").textContent =
                    "No vehicle selected";
            } else {
                init();
            }

            async function init() {
                await checkSession();
                await loadDetails();
                await loadReviews();
                await loadWishlistStatus();
            }

            async function checkSession() {
                const { ok, body } = await apiFetch("/api/auth/me");
                currentUser = ok ? body.data : null;

                const isCustomer = currentUser && currentUser.role === "customer";
                document.getElementById("reviewFormWrapper").hidden = !isCustomer;
                document.getElementById("reviewSignInPrompt").hidden = isCustomer;
            }

            function renderPromoBadges(promotions) {
                if (!promotions || promotions.length === 0) return "";
                return promotions
                    .map(
                        (promo) =>
                            '<span class="promo-badge">' +
                            promo.name +
                            "</span>",
                    )
                    .join("");
            }

            function bestPromoDiscount(promotions) {
                if (!promotions || promotions.length === 0) return 0;
                return Math.max(
                    ...promotions.map((promo) => promo.discount_amount),
                );
            }

            function renderCustomizations(categories) {
                customizationCategories = categories;
                const container = document.getElementById(
                    "customizationCategories",
                );
                container.innerHTML = "";

                if (!categories || categories.length === 0) {
                    container.innerHTML =
                        "<p>No customization options for this vehicle.</p>";
                    return;
                }

                for (const category of categories) {
                    const div = document.createElement("div");
                    div.className = "category";
                    const inputType =
                        category.select_type === "MULTI" ? "checkbox" : "radio";

                    let html = "<h3>" + category.name + "</h3>";
                    for (const option of category.options) {
                        html +=
                            '<label><input type="' +
                            inputType +
                            '" name="cat_' +
                            category.category_id +
                            '" value="' +
                            option.option_id +
                            '" /> ' +
                            option.name +
                            (option.price_delta
                                ? " (+" + formatMoney(option.price_delta) + ")"
                                : " (included)") +
                            "</label>";
                    }
                    div.innerHTML = html;
                    container.appendChild(div);
                }
            }

            function renderEquipped(equipped) {
                const section = document.getElementById("equippedSection");
                const list = document.getElementById("equippedList");

                if (!equipped || equipped.length === 0) {
                    section.hidden = true;
                    return;
                }

                section.hidden = false;
                list.innerHTML = equipped
                    .map(
                        (category) =>
                            "<strong>" +
                            category.name +
                            ":</strong> " +
                            category.options.map((o) => o.name).join(", "),
                    )
                    .join("<br />");
            }

            async function loadDetails() {
                const { ok, body } = await apiFetch(
                    "/api/shop/catalog/" + encodeURIComponent(cid),
                );

                if (!ok) {
                    document.getElementById("status").textContent = errorMessage(
                        body,
                        "Could not load this vehicle.",
                    );
                    document.getElementById("vehicleName").textContent =
                        "Not found";
                    return;
                }

                const data = body.data;
                document.getElementById("status").textContent = "";
                document.getElementById("vehicleName").textContent = data.name;
                document.title = "ElectriCity - " + data.name;
                document.getElementById("detailsPanel").hidden = false;
                document.getElementById("optionsPanel").hidden = false;

                const gallery = document.getElementById("gallery");
                gallery.innerHTML = (data.images || [])
                    .map(
                        (image) =>
                            '<img src="' +
                            image.url +
                            '" alt="' +
                            (image.alt_text || data.name) +
                            '" onerror="this.style.visibility=\'hidden\'" />',
                    )
                    .join("");

                const discount = bestPromoDiscount(data.promotions);
                const finalPrice = data.base_price - discount;
                document.getElementById("priceRow").innerHTML =
                    (discount > 0
                        ? '<span class="original">' +
                          formatMoney(data.base_price) +
                          "</span>"
                        : "") + formatMoney(finalPrice);
                document.getElementById("promoBadges").innerHTML =
                    renderPromoBadges(data.promotions);

                document.getElementById("description").textContent =
                    data.description || "";

                const vehicle = data.vehicle || {};
                document.getElementById("specGrid").innerHTML = [
                    ["Year", vehicle.year],
                    ["Condition", vehicle.condition],
                    ["Mileage", vehicle.mileage + " mi"],
                    ["Body shape", vehicle.body_shape],
                    ["Doors", vehicle.door_count],
                    ["Drivetrain", vehicle.drivetrain],
                    ["Stock", data.stock],
                ]
                    .map(
                        ([label, value]) =>
                            "<div>" +
                            (value ?? "—") +
                            "<span>" +
                            label +
                            "</span></div>",
                    )
                    .join("");

                if (data.history) {
                    const parts = [];
                    parts.push(
                        data.history.has_accidents
                            ? "Accident history reported."
                            : "No reported accidents.",
                    );
                    if (data.history.owners_count) {
                        parts.push(
                            data.history.owners_count + " previous owner(s).",
                        );
                    }
                    if (data.history.report) {
                        parts.push(
                            '<a href="' +
                                data.history.report.url +
                                '" target="_blank">View full history report</a>',
                        );
                    }
                    document.getElementById("historyInfo").innerHTML =
                        parts.join(" ");
                } else {
                    document.getElementById("historyInfo").textContent = "";
                }

                renderCustomizations(data.customizations);
                renderEquipped(data.equipped_options);

                document.getElementById("reviewSummary").textContent =
                    data.review_count +
                    " review(s)" +
                    (data.avg_rating != null
                        ? ", average rating " + data.avg_rating.toFixed(1) + "/5"
                        : "");
            }

            // ------- Configuration builder -------
            document
                .getElementById("buildConfigBtn")
                .addEventListener("click", async () => {
                    const configErrorEl = document.getElementById("configError");
                    const configSuccessEl =
                        document.getElementById("configSuccess");
                    configErrorEl.textContent = "";
                    configSuccessEl.textContent = "";

                    const optionIds = [
                        ...document.querySelectorAll(
                            "#customizationCategories input:checked",
                        ),
                    ].map((input) => Number(input.value));

                    const { ok, body } = await apiFetch(
                        "/api/shop/catalog/configurations",
                        {
                            method: "POST",
                            body: JSON.stringify({
                                cid: Number(cid),
                                option_ids: optionIds,
                            }),
                        },
                    );

                    if (!ok) {
                        configErrorEl.textContent = errorMessage(
                            body,
                            "Could not build that configuration.",
                        );
                        return;
                    }

                    configSuccessEl.textContent =
                        "Configuration #" +
                        body.data.config_id +
                        " created — total price " +
                        formatMoney(body.data.total_price) +
                        ".";
                });

            document
                .getElementById("lookupConfigBtn")
                .addEventListener("click", async () => {
                    const lookupErrorEl = document.getElementById("lookupError");
                    lookupErrorEl.textContent = "";

                    const configId =
                        document.getElementById("configIdInput").value.trim();
                    if (!configId) {
                        lookupErrorEl.textContent = "Enter a configuration ID.";
                        return;
                    }

                    const { ok, body } = await apiFetch(
                        "/api/shop/catalog/configurations/" +
                            encodeURIComponent(configId),
                    );

                    if (!ok) {
                        lookupErrorEl.textContent = errorMessage(
                            body,
                            "Configuration not found.",
                        );
                        return;
                    }

                    const optionNames = body.data.options
                        .flatMap((category) =>
                            category.options.map((o) => o.name),
                        )
                        .join(", ");
                    lookupErrorEl.textContent = "";
                    alert(
                        "Configuration #" +
                            body.data.config_id +
                            " for catalog item " +
                            body.data.catalog_item_id +
                            "\nTotal price: " +
                            formatMoney(body.data.total_price) +
                            "\nOptions: " +
                            (optionNames || "none"),
                    );
                });

            // ------- Wishlist status (read-only on this page) -------
            async function loadWishlistStatus() {
                const statusEl = document.getElementById("wishlistStatus");
                const isCustomer =
                    currentUser && currentUser.role === "customer";

                if (!isCustomer) {
                    statusEl.innerHTML =
                        '<a href="/auth.html">Sign in as a customer</a> to see your wishlist status.';
                    return;
                }

                const { ok, status, body } = await apiFetch(
                    "/api/shop/catalog/" + encodeURIComponent(cid) + "/wishlist",
                );

                if (ok) {
                    statusEl.textContent =
                        "♥ This vehicle is in your wishlist (added " +
                        new Date(body.data.added_at).toLocaleDateString() +
                        ").";
                } else if (status === 404) {
                    statusEl.textContent =
                        "This vehicle is not in your wishlist.";
                } else {
                    statusEl.textContent = errorMessage(
                        body,
                        "Could not check wishlist status.",
                    );
                }
            }

            // ------- Reviews -------
            async function loadReviews() {
                const { ok, body } = await apiFetch(
                    "/api/shop/catalog/" +
                        encodeURIComponent(cid) +
                        "/reviews?page=" +
                        reviewsPage +
                        "&limit=5",
                );

                const listEl = document.getElementById("reviewsList");

                if (!ok) {
                    listEl.innerHTML =
                        "<p class='error'>" +
                        errorMessage(body, "Could not load reviews.") +
                        "</p>";
                    return;
                }

                const { items, pagination } = body.data;

                if (items.length === 0) {
                    listEl.innerHTML = "<p>No reviews yet.</p>";
                } else {
                    listEl.innerHTML = items
                        .map(
                            (review) =>
                                '<div class="review"><span class="stars">' +
                                starString(review.rating) +
                                "</span> " +
                                (review.title
                                    ? "<strong>" + review.title + "</strong>"
                                    : "") +
                                "<p>" +
                                review.body +
                                '</p><div class="meta">' +
                                review.author.first_name +
                                " " +
                                review.author.last_name +
                                " — " +
                                new Date(review.created_at).toLocaleDateString() +
                                "</div></div>",
                        )
                        .join("");
                }

                document.getElementById("reviewsPageIndicator").textContent =
                    "Page " + pagination.page + " of " + (pagination.totalPages || 1);
                document.getElementById("prevReviewsBtn").disabled =
                    !pagination.hasPrev;
                document.getElementById("nextReviewsBtn").disabled =
                    !pagination.hasNext;
            }

            document
                .getElementById("prevReviewsBtn")
                .addEventListener("click", () => {
                    if (reviewsPage > 1) {
                        reviewsPage -= 1;
                        loadReviews();
                    }
                });

            document
                .getElementById("nextReviewsBtn")
                .addEventListener("click", () => {
                    reviewsPage += 1;
                    loadReviews();
                });

            document
                .getElementById("reviewForm")
                .addEventListener("submit", async (event) => {
                    event.preventDefault();
                    const reviewErrorEl = document.getElementById("reviewError");
                    const reviewSuccessEl =
                        document.getElementById("reviewSuccess");
                    reviewErrorEl.textContent = "";
                    reviewSuccessEl.textContent = "";

                    const payload = {
                        rating: Number(
                            document.getElementById("reviewRating").value,
                        ),
                        title:
                            document.getElementById("reviewTitle").value ||
                            null,
                        body: document.getElementById("reviewBody").value,
                    };

                    const { ok, body } = await apiFetch(
                        "/api/shop/catalog/" +
                            encodeURIComponent(cid) +
                            "/reviews",
                        { method: "POST", body: JSON.stringify(payload) },
                    );

                    if (!ok) {
                        reviewErrorEl.textContent = errorMessage(
                            body,
                            "Could not publish your review.",
                        );
                        return;
                    }

                    reviewSuccessEl.textContent = "Review published!";
                    document.getElementById("reviewForm").reset();
                    reviewsPage = 1;
                    await loadReviews();
                });
        </script>
    </body>
</html>
