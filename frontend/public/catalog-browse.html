<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <title>ElectriCity Catalog</title>
        <link
            rel="stylesheet"
            href="/site.css"
        />
    </head>
    <body class="page-wide">
        <nav
            class="history-nav"
            aria-label="Browser history"
        >
            <button
                type="button"
                id="histBack"
            >
                &lt; Back
            </button>
            <button
                type="button"
                id="histForward"
            >
                &gt; Forward
            </button>
        </nav>
        <h1>ElectriCity Catalog</h1>
        <p id="status">Loading vehicles...</p>

        <div class="panel">
            <div class="search-row">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search by brand or model..."
                />
                <button
                    type="button"
                    id="searchBtn"
                >
                    Search
                </button>
                <button
                    type="button"
                    id="clearSearchBtn"
                >
                    Clear Search
                </button>
            </div>

            <h2>Filters</h2>
            <div class="filters-grid">
                <label
                    >Condition
                    <select id="fCondition">
                        <option value="">Any</option>
                        <option value="new">New</option>
                        <option value="used">Used</option>
                    </select>
                </label>
                <label
                    >Year (min)
                    <input
                        type="number"
                        id="fYearMin"
                        min="0"
                    />
                </label>
                <label
                    >Year (max)
                    <input
                        type="number"
                        id="fYearMax"
                        min="0"
                    />
                </label>
                <label
                    >Price (min)
                    <input
                        type="number"
                        id="fPriceMin"
                        min="0"
                    />
                </label>
                <label
                    >Price (max)
                    <input
                        type="number"
                        id="fPriceMax"
                        min="0"
                    />
                </label>
                <label
                    >Mileage (max)
                    <input
                        type="number"
                        id="fMileageMax"
                        min="0"
                    />
                </label>
                <label
                    >Body shape
                    <select id="fBodyShape">
                        <option value="">Any</option>
                        <option value="Sedan">Sedan</option>
                        <option value="SUV">SUV</option>
                        <option value="Hatchback">Hatchback</option>
                        <option value="Truck">Truck</option>
                    </select>
                </label>
                <label
                    >Drivetrain
                    <select id="fDrivetrain">
                        <option value="">Any</option>
                        <option value="FWD">FWD</option>
                        <option value="RWD">RWD</option>
                        <option value="AWD">AWD</option>
                    </select>
                </label>
                <label
                    >Promotion
                    <select id="fPromo">
                        <option value="">Any</option>
                        <option value="hot_deal">Hot Deal</option>
                        <option value="seasonal">Seasonal</option>
                        <option value="clearance">Clearance</option>
                        <option value="featured">Featured</option>
                    </select>
                </label>
                <label
                    >Sort by
                    <select id="fSort">
                        <option value="added_desc">Newest</option>
                        <option value="price_asc">Price: Low to High</option>
                        <option value="price_desc">Price: High to Low</option>
                        <option value="year_desc">Year: Newest</option>
                        <option value="year_asc">Year: Oldest</option>
                        <option value="mileage_asc">
                            Mileage: Low to High
                        </option>
                        <option value="mileage_desc">
                            Mileage: High to Low
                        </option>
                    </select>
                </label>
            </div>
            <div class="filters-actions">
                <button
                    type="button"
                    id="applyFiltersBtn"
                >
                    Apply Filters
                </button>
                <button
                    type="button"
                    id="clearFiltersBtn"
                >
                    Clear Filters
                </button>
            </div>
            <p
                class="error"
                id="filtersError"
            ></p>
            <p
                class="success"
                id="cartSuccess"
            ></p>
            <p
                class="error"
                id="cartError"
            ></p>
        </div>

        <div class="panel">
            <h2>Results</h2>
            <div id="results"></div>
            <div class="pagination">
                <button
                    type="button"
                    id="prevPageBtn"
                >
                    &laquo; Prev
                </button>
                <span id="pageIndicator"></span>
                <button
                    type="button"
                    id="nextPageBtn"
                >
                    Next &raquo;
                </button>
            </div>
            <div>
                <button
                    type="button"
                    id="compareBtn"
                    disabled
                >
                    Compare Selected (0)
                </button>
            </div>
        </div>

        <div
            class="panel"
            id="comparePanel"
            hidden
        >
            <h2>Comparison</h2>
            <table id="compareTable"></table>
            <p
                class="error"
                id="compareError"
            ></p>
        </div>

        <script>
            const isProduction =
                window.location.hostname === "project-electricity.app" ||
                window.location.hostname === "www.project-electricity.app";
            const apiBase = isProduction
                ? "https://api.project-electricity.app"
                : window.location.origin.replace(/\/$/, "");
            const fetchCredentials = isProduction ? "include" : "same-origin";

            const statusEl = document.getElementById("status");
            const resultsEl = document.getElementById("results");
            const pageIndicatorEl = document.getElementById("pageIndicator");
            const compareBtn = document.getElementById("compareBtn");
            const comparePanelEl = document.getElementById("comparePanel");
            const compareTableEl = document.getElementById("compareTable");
            const compareErrorEl = document.getElementById("compareError");
            const filtersErrorEl = document.getElementById("filtersError");
            const cartSuccessEl = document.getElementById("cartSuccess");
            const cartErrorEl = document.getElementById("cartError");

            let currentPage = 1;
            let searchTerm = "";
            const selectedForCompare = new Set();

            async function apiFetch(path, options = {}) {
                const headers = {
                    "Content-Type": "application/json",
                    ...(options.headers || {}),
                };

                const opts = {
                    credentials: fetchCredentials,
                    ...options,
                    headers,
                };

                let res = await fetch(apiBase + path, opts);
                const body = await res.json().catch(() => null);
                return { ok: res.ok, status: res.status, body };
            }

            async function addToCart(cid) {
                cartErrorEl.textContent = "";
                cartSuccessEl.textContent = "";

                const { ok, body } = await apiFetch("/api/shop/cart/items", {
                    method: "POST",
                    body: JSON.stringify({
                        cid: Number(cid),
                        config_id: null,
                        quantity: 1,
                    }),
                });

                if (!ok) {
                    cartErrorEl.textContent = errorMessage(
                        body,
                        "Could not add that vehicle to your cart.",
                    );
                    return;
                }

                cartSuccessEl.innerHTML =
                    "Added vehicle #" +
                    cid +
                    ' to cart. <a href="/cart.html">Open cart</a>';
            }

            function errorMessage(body, fallback) {
                return body?.data?.message || fallback;
            }

            function readFilters() {
                const filters = {};

                const condition = document.getElementById("fCondition").value;
                if (condition) filters.condition = condition;

                const yearMin = document.getElementById("fYearMin").value;
                if (yearMin) filters.year_min = yearMin;

                const yearMax = document.getElementById("fYearMax").value;
                if (yearMax) filters.year_max = yearMax;

                const priceMin = document.getElementById("fPriceMin").value;
                if (priceMin) filters.price_min = priceMin;

                const priceMax = document.getElementById("fPriceMax").value;
                if (priceMax) filters.price_max = priceMax;

                const mileageMax = document.getElementById("fMileageMax").value;
                if (mileageMax) filters.mileage_max = mileageMax;

                const bodyShape = document.getElementById("fBodyShape").value;
                if (bodyShape) filters.body_shape = bodyShape;

                const drivetrain = document.getElementById("fDrivetrain").value;
                if (drivetrain) filters.drivetrain = drivetrain;

                const promo = document.getElementById("fPromo").value;
                if (promo) filters.promo = promo;

                filters.sort = document.getElementById("fSort").value;

                return filters;
            }

            function buildQueryString(extra = {}) {
                const params = new URLSearchParams({
                    page: String(currentPage),
                    limit: "12",
                    ...readFilters(),
                    ...extra,
                });
                return params.toString();
            }

            function formatMoney(amount) {
                return (
                    "$" +
                    Number(amount).toLocaleString(undefined, {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2,
                    })
                );
            }

            function renderPromoBadges(promotions) {
                if (!promotions || promotions.length === 0) return "";
                return promotions
                    .map(
                        (promo) =>
                            '<span class="promo-badge">' +
                            promo.name +
                            "</span>",
                    )
                    .join("");
            }

            function bestPromoDiscount(promotions) {
                if (!promotions || promotions.length === 0) return 0;
                return Math.max(
                    ...promotions.map((promo) => promo.discount_amount),
                );
            }

            function renderResults(items) {
                resultsEl.innerHTML = "";

                if (items.length === 0) {
                    resultsEl.innerHTML = "<p>No vehicles match.</p>";
                    return;
                }

                for (const item of items) {
                    const card = document.createElement("div");
                    card.className = "card";

                    const discount = bestPromoDiscount(item.promotions);
                    const finalPrice = item.base_price - discount;

                    const vehicle = item.vehicle || {};
                    const specs = [
                        vehicle.year,
                        vehicle.condition,
                        vehicle.body_shape,
                        vehicle.drivetrain,
                        vehicle.mileage != null
                            ? vehicle.mileage + " mi"
                            : null,
                    ]
                        .filter(Boolean)
                        .join(" * ");

                    card.innerHTML =
                        '<a href="/catalog-details.html?cid=' +
                        item.id +
                        '">' +
                        '<img src="' +
                        (item.primary_image_url || "") +
                        '" alt="' +
                        item.name +
                        '" onerror="this.style.visibility=\'hidden\'" />' +
                        "<h3>" +
                        item.name +
                        "</h3>" +
                        "</a>" +
                        '<div class="specs">' +
                        specs +
                        "</div>" +
                        '<div class="price">' +
                        (discount > 0
                            ? '<span class="original">' +
                              formatMoney(item.base_price) +
                              "</span>"
                            : "") +
                        formatMoney(finalPrice) +
                        "</div>" +
                        "<div>" +
                        renderPromoBadges(item.promotions) +
                        "</div>" +
                        '<label class="compare-check"><input type="checkbox" class="compareCheckbox" data-cid="' +
                        item.id +
                        '" ' +
                        (selectedForCompare.has(item.id) ? "checked" : "") +
                        "/> Compare</label>" +
                        '<div><button type="button" class="addCartBtn" data-cid="' +
                        item.id +
                        '">Add to cart</button></div>';

                    resultsEl.appendChild(card);
                }

                resultsEl
                    .querySelectorAll(".compareCheckbox")
                    .forEach((checkbox) => {
                        checkbox.addEventListener("change", (event) => {
                            const cid = Number(event.target.dataset.cid);
                            if (event.target.checked) {
                                if (selectedForCompare.size >= 5) {
                                    event.target.checked = false;
                                    filtersErrorEl.textContent =
                                        "You can compare at most 5 vehicles at once.";
                                    return;
                                }
                                selectedForCompare.add(cid);
                            } else {
                                selectedForCompare.delete(cid);
                            }
                            updateCompareButton();
                        });
                    });

                resultsEl.querySelectorAll(".addCartBtn").forEach((button) => {
                    button.addEventListener("click", () => {
                        addToCart(button.dataset.cid);
                    });
                });
            }

            function updateCompareButton() {
                const count = selectedForCompare.size;
                compareBtn.textContent = "Compare Selected (" + count + ")";
                compareBtn.disabled = count < 2;
            }

            async function loadResults() {
                filtersErrorEl.textContent = "";
                statusEl.textContent = "Loading vehicles...";

                const query = buildQueryString(
                    searchTerm ? { q: searchTerm } : {},
                );
                const path = searchTerm
                    ? "/api/shop/catalog/vehicles/search?" + query
                    : "/api/shop/catalog/vehicles?" + query;

                const { ok, body } = await apiFetch(path);

                if (!ok) {
                    statusEl.textContent = "";
                    filtersErrorEl.textContent = errorMessage(
                        body,
                        "Could not load the catalog.",
                    );
                    resultsEl.innerHTML = "";
                    return;
                }

                const { items, pagination } = body.data;
                renderResults(items);

                statusEl.textContent =
                    pagination.total +
                    " vehicle(s) found" +
                    (searchTerm ? ' for "' + searchTerm + '"' : "") +
                    ".";
                pageIndicatorEl.textContent =
                    "Page " + pagination.page + " of " + pagination.totalPages;
                document.getElementById("prevPageBtn").disabled =
                    !pagination.hasPrev;
                document.getElementById("nextPageBtn").disabled =
                    !pagination.hasNext;
            }

            // ------- Search -------
            document
                .getElementById("searchBtn")
                .addEventListener("click", () => {
                    searchTerm = document
                        .getElementById("searchInput")
                        .value.trim();
                    currentPage = 1;
                    loadResults();
                });

            document
                .getElementById("searchInput")
                .addEventListener("keydown", (event) => {
                    if (event.key === "Enter") {
                        event.preventDefault();
                        document.getElementById("searchBtn").click();
                    }
                });

            document
                .getElementById("clearSearchBtn")
                .addEventListener("click", () => {
                    searchTerm = "";
                    document.getElementById("searchInput").value = "";
                    currentPage = 1;
                    loadResults();
                });

            // ------- Filters -------
            document
                .getElementById("applyFiltersBtn")
                .addEventListener("click", () => {
                    currentPage = 1;
                    loadResults();
                });

            document
                .getElementById("clearFiltersBtn")
                .addEventListener("click", () => {
                    document.getElementById("fCondition").value = "";
                    document.getElementById("fYearMin").value = "";
                    document.getElementById("fYearMax").value = "";
                    document.getElementById("fPriceMin").value = "";
                    document.getElementById("fPriceMax").value = "";
                    document.getElementById("fMileageMax").value = "";
                    document.getElementById("fBodyShape").value = "";
                    document.getElementById("fDrivetrain").value = "";
                    document.getElementById("fPromo").value = "";
                    document.getElementById("fSort").value = "added_desc";
                    currentPage = 1;
                    loadResults();
                });

            // ------- Pagination -------
            document
                .getElementById("prevPageBtn")
                .addEventListener("click", () => {
                    if (currentPage > 1) {
                        currentPage -= 1;
                        loadResults();
                    }
                });

            document
                .getElementById("nextPageBtn")
                .addEventListener("click", () => {
                    currentPage += 1;
                    loadResults();
                });

            // ------- Compare -------
            compareBtn.addEventListener("click", async () => {
                compareErrorEl.textContent = "";
                const cids = [...selectedForCompare].join(",");

                const { ok, body } = await apiFetch(
                    "/api/shop/catalog/compare?cids=" +
                        encodeURIComponent(cids),
                );

                if (!ok) {
                    compareErrorEl.textContent = errorMessage(
                        body,
                        "Could not compare the selected vehicles.",
                    );
                    return;
                }

                renderCompareTable(body.data);
                comparePanelEl.hidden = false;
                comparePanelEl.scrollIntoView({ behavior: "smooth" });
            });

            function renderCompareTable(matrix) {
                const { columns, rows } = matrix;

                let html = "<tr><th>Field</th>";
                for (const column of columns) {
                    html += "<th>" + column.label + "</th>";
                }
                html += "</tr>";

                for (const row of rows) {
                    html += "<tr><td>" + row.field + "</td>";
                    for (const cell of row.cells) {
                        const cellClass = cell.isBest
                            ? "best"
                            : cell.isTied
                              ? "tied"
                              : cell.isWorse
                                ? "worse"
                                : "";
                        html +=
                            '<td class="' +
                            cellClass +
                            '">' +
                            (cell.value ?? "*") +
                            "</td>";
                    }
                    html += "</tr>";
                }

                compareTableEl.innerHTML = html;
            }

            loadResults();
        </script>
        <script>
            (function () {
                const backBtn = document.getElementById("histBack");
                const forwardBtn = document.getElementById("histForward");
                if (!backBtn || !forwardBtn) return;

                function syncNav() {
                    // history.length does not expose a forward stack; enable Forward
                    // after the user goes back at least once in this page session.
                    backBtn.disabled = window.history.length <= 1;
                }

                let canForward = false;
                forwardBtn.disabled = true;

                backBtn.addEventListener("click", function () {
                    canForward = true;
                    forwardBtn.disabled = false;
                    window.history.back();
                });
                forwardBtn.addEventListener("click", function () {
                    if (!canForward) return;
                    window.history.forward();
                });
                window.addEventListener("pageshow", syncNav);
                syncNav();
            })();
        </script>
    </body>
</html>
