<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <title>ElectriCity Payments</title>
        <link
            rel="stylesheet"
            href="/site.css"
        />
    </head>
    <body class="page-mid">
        <nav
            class="history-nav"
            aria-label="Browser history"
        >
            <button
                type="button"
                id="histBack"
            >
                &lt; Back
            </button>
            <button
                type="button"
                id="histForward"
            >
                &gt; Forward
            </button>
        </nav>
        <h1>ElectriCity Payments</h1>
        <p id="status">Checking session...</p>
        <section
            id="guestView"
            hidden
        >
            <div class="panel">
                <p>
                    <a href="/auth.html">Sign in as a customer</a> to see your
                    payment history.
                </p>
            </div>
        </section>

        <section
            id="customerView"
            hidden
        >
            <div class="panel">
                <h2>Your Payment Attempts</h2>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Attempt ID</th>
                            <th>Order</th>
                            <th>Amount</th>
                            <th>Method</th>
                            <th>Status</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody id="paymentsBody">
                        <tr>
                            <td colspan="6">Loading payments...</td>
                        </tr>
                    </tbody>
                </table>
                <div class="pagination">
                    <button
                        type="button"
                        id="prevPage"
                    >
                        &laquo; Prev
                    </button>
                    <span id="pageIndicator"></span>
                    <button
                        type="button"
                        id="nextPage"
                    >
                        Next &raquo;
                    </button>
                </div>
                <p
                    class="error"
                    id="listError"
                ></p>
            </div>
        </section>

        <script>
            const isProduction =
                window.location.hostname === "project-electricity.app" ||
                window.location.hostname === "www.project-electricity.app";
            const apiBase = isProduction
                ? "https://api.project-electricity.app"
                : window.location.origin.replace(/\/$/, "");
            const fetchCredentials = isProduction ? "include" : "same-origin";

            let currentPage = 1;

            async function apiFetch(path, options = {}) {
                const opts = {
                    credentials: fetchCredentials,
                    headers: {
                        "Content-Type": "application/json",
                        ...(options.headers || {}),
                    },
                    ...options,
                };

                let res = await fetch(apiBase + path, opts);

                if (
                    res.status === 401 &&
                    path !== "/api/auth/login" &&
                    path !== "/api/auth/refresh"
                ) {
                    const refreshRes = await fetch(
                        apiBase + "/api/auth/refresh",
                        { method: "POST", credentials: fetchCredentials },
                    );
                    if (refreshRes.ok) {
                        res = await fetch(apiBase + path, opts);
                    }
                }

                const body = await res.json().catch(() => null);
                return { ok: res.ok, status: res.status, body };
            }

            function errorMessage(body, fallback) {
                return body?.data?.message || fallback;
            }

            function escapeHtml(value) {
                return String(value ?? "")
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;");
            }

            function formatMoney(amount) {
                return (
                    "$" +
                    Number(amount).toLocaleString(undefined, {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2,
                    })
                );
            }

            function formatDate(value) {
                return value ? new Date(value).toLocaleString() : "-";
            }

            function showGuestView() {
                document.getElementById("status").textContent =
                    "Not signed in.";
                document.getElementById("guestView").hidden = false;
                document.getElementById("customerView").hidden = true;
            }

            function showCustomerView(user) {
                document.getElementById("status").textContent =
                    "Signed in as " + user.email;
                document.getElementById("guestView").hidden = true;
                document.getElementById("customerView").hidden = false;
            }

            function renderPayments(items) {
                const tbody = document.getElementById("paymentsBody");
                tbody.innerHTML = "";

                if (!items || items.length === 0) {
                    tbody.innerHTML =
                        '<tr><td colspan="6">You have no payment attempts yet.</td></tr>';
                    return;
                }

                for (const payment of items) {
                    const row = document.createElement("tr");
                    row.innerHTML =
                        "<td>" +
                        escapeHtml(payment.attempt_id) +
                        "</td>" +
                        "<td>" +
                        escapeHtml(payment.order_id) +
                        "</td>" +
                        "<td>" +
                        escapeHtml(formatMoney(payment.amount)) +
                        "</td>" +
                        "<td>" +
                        escapeHtml(payment.payment_method) +
                        "</td>" +
                        "<td>" +
                        escapeHtml(payment.status) +
                        "</td>" +
                        "<td>" +
                        escapeHtml(formatDate(payment.attempted_at)) +
                        "</td>";
                    tbody.appendChild(row);
                }
            }

            async function loadUserPayments() {
                const tbody = document.getElementById("paymentsBody");
                const listErrorEl = document.getElementById("listError");
                listErrorEl.textContent = "";

                const { ok, body } = await apiFetch(
                    "/api/dashboard/customer/payments?page=" +
                        currentPage +
                        "&limit=10",
                );

                if (!ok) {
                    tbody.innerHTML =
                        '<tr><td colspan="6">Could not load payments.</td></tr>';
                    listErrorEl.textContent = errorMessage(
                        body,
                        "Could not load payments.",
                    );
                    return;
                }

                const { items, pagination } = body.data;
                renderPayments(items);

                document.getElementById("pageIndicator").textContent =
                    "Page " +
                    pagination.page +
                    " of " +
                    (pagination.totalPages || 1);
                document.getElementById("prevPage").disabled =
                    !pagination.hasPrev;
                document.getElementById("nextPage").disabled =
                    !pagination.hasNext;
            }

            async function checkSession() {
                const { ok, body } = await apiFetch("/api/auth/me");

                if (!ok) {
                    showGuestView();
                    return;
                }

                const user = body.data;

                if (user.role !== "customer") {
                    document.getElementById("status").textContent =
                        "Payments are for customer accounts only.";
                    document.getElementById("guestView").hidden = false;
                    document.getElementById("customerView").hidden = true;
                    document.getElementById("guestView").innerHTML =
                        '<div class="panel"><p>Payment history is for customer accounts. You are signed in as an admin.</p></div>';
                    return;
                }

                showCustomerView(user);
                await loadUserPayments();
            }

            document
                .getElementById("prevPage")
                .addEventListener("click", () => {
                    if (currentPage > 1) {
                        currentPage -= 1;
                        loadUserPayments();
                    }
                });

            document
                .getElementById("nextPage")
                .addEventListener("click", () => {
                    currentPage += 1;
                    loadUserPayments();
                });

            checkSession();
        </script>
        <script>
            (function () {
                const backBtn = document.getElementById("histBack");
                const forwardBtn = document.getElementById("histForward");
                if (!backBtn || !forwardBtn) return;

                function syncNav() {
                    backBtn.disabled = window.history.length <= 1;
                }

                let canForward = false;
                forwardBtn.disabled = true;

                backBtn.addEventListener("click", function () {
                    canForward = true;
                    forwardBtn.disabled = false;
                    window.history.back();
                });
                forwardBtn.addEventListener("click", function () {
                    if (!canForward) return;
                    window.history.forward();
                });
                window.addEventListener("pageshow", syncNav);
                syncNav();
            })();
        </script>
    </body>
</html>
