<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <title>ElectriCity Wishlist</title>
        <link
            rel="stylesheet"
            href="/site.css"
        />
    </head>
    <body class="page-mid">
        <nav
            class="history-nav"
            aria-label="Browser history"
        >
            <button
                type="button"
                id="histBack"
            >
                &lt; Back
            </button>
            <button
                type="button"
                id="histForward"
            >
                &gt; Forward
            </button>
        </nav>
        <h1>ElectriCity Wishlist</h1>
        <p id="status">Checking session...</p>

        <section
            id="guestView"
            hidden
        >
            <div class="panel">
                <p>
                    <a href="/auth.html">Sign in as a customer</a> to save
                    vehicles to your wishlist.
                </p>
                <p>
                    Browse the <a href="/catalog-browse.html">catalog</a> to
                    find vehicles first.
                </p>
            </div>
        </section>

        <section
            id="customerView"
            hidden
        >
            <div class="panel">
                <h2>Add Vehicle</h2>
                <label
                    >Catalog item ID (cid)
                    <input
                        type="number"
                        id="addCid"
                        min="1"
                    />
                </label>
                <button
                    type="button"
                    id="addWishlistBtn"
                >
                    Add to Wishlist
                </button>
                <p class="hint">
                    Don't know a catalog ID? Browse the
                    <a href="/catalog-browse.html">catalog</a> or open a
                    <a href="/catalog-details.html?cid=1">details page</a>.
                </p>
                <p
                    class="success"
                    id="addSuccess"
                ></p>
                <p
                    class="error"
                    id="addError"
                ></p>
            </div>

            <div class="panel">
                <h2>Saved Vehicles</h2>
                <div id="wishlistItems"></div>
                <div class="pagination">
                    <button
                        type="button"
                        id="prevPageBtn"
                    >
                        &laquo; Prev
                    </button>
                    <span id="pageIndicator"></span>
                    <button
                        type="button"
                        id="nextPageBtn"
                    >
                        Next &raquo;
                    </button>
                </div>
                <p
                    class="error"
                    id="listError"
                ></p>
            </div>
        </section>

        <script>
            const isProduction =
                window.location.hostname === "project-electricity.app" ||
                window.location.hostname === "www.project-electricity.app";
            const apiBase = isProduction
                ? "https://api.project-electricity.app"
                : window.location.origin.replace(/\/$/, "");
            const fetchCredentials = isProduction ? "include" : "same-origin";

            let currentUser = null;
            let currentPage = 1;

            async function apiFetch(path, options = {}) {
                const opts = {
                    credentials: fetchCredentials,
                    headers: {
                        "Content-Type": "application/json",
                        ...(options.headers || {}),
                    },
                    ...options,
                };

                let res = await fetch(apiBase + path, opts);

                if (
                    res.status === 401 &&
                    path !== "/api/auth/login" &&
                    path !== "/api/auth/refresh"
                ) {
                    const refreshRes = await fetch(
                        apiBase + "/api/auth/refresh",
                        { method: "POST", credentials: fetchCredentials },
                    );
                    if (refreshRes.ok) {
                        res = await fetch(apiBase + path, opts);
                    }
                }

                const body = await res.json().catch(() => null);
                return { ok: res.ok, status: res.status, body };
            }

            function errorMessage(body, fallback) {
                return body?.data?.message || fallback;
            }

            function formatMoney(amount) {
                return (
                    "$" +
                    Number(amount).toLocaleString(undefined, {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2,
                    })
                );
            }

            function formatDate(value) {
                return value ? new Date(value).toLocaleDateString() : "unknown";
            }

            function showGuestView() {
                document.getElementById("status").textContent =
                    "Not signed in.";
                document.getElementById("guestView").hidden = false;
                document.getElementById("customerView").hidden = true;
            }

            function showCustomerView(user) {
                document.getElementById("status").textContent =
                    "Signed in as " + user.email;
                document.getElementById("guestView").hidden = true;
                document.getElementById("customerView").hidden = false;
            }

            function renderWishlist(items) {
                const listEl = document.getElementById("wishlistItems");
                listEl.innerHTML = "";

                if (!items || items.length === 0) {
                    listEl.innerHTML = "<p>No saved vehicles yet.</p>";
                    return;
                }

                for (const item of items) {
                    const vehicle = item.catalog_item || {};
                    const line = document.createElement("div");
                    line.className = "line";
                    line.innerHTML =
                        (vehicle.primary_image_url
                            ? '<p><img src="' +
                              vehicle.primary_image_url +
                              '" alt="' +
                              (vehicle.name || "Vehicle") +
                              '" onerror="this.style.visibility=\'hidden\'" /></p>'
                            : "") +
                        "<p><strong>" +
                        (vehicle.name || "Vehicle #" + item.cid) +
                        "</strong><br />" +
                        "Catalog ID: " +
                        item.cid +
                        "<br />" +
                        formatMoney(vehicle.base_price) +
                        "<br />" +
                        "Saved " +
                        formatDate(item.added_at) +
                        "</p>" +
                        "<p>" +
                        '<a href="/catalog-details.html?cid=' +
                        item.cid +
                        '">View details</a> ' +
                        '<button type="button" class="removeWishlistBtn" data-cid="' +
                        item.cid +
                        '">Remove</button>' +
                        "</p>";
                    listEl.appendChild(line);
                }

                listEl.querySelectorAll(".removeWishlistBtn").forEach((btn) => {
                    btn.addEventListener("click", () =>
                        removeFromWishlist(Number(btn.dataset.cid)),
                    );
                });
            }

            async function loadWishlist() {
                const listErrorEl = document.getElementById("listError");
                listErrorEl.textContent = "";

                const { ok, body } = await apiFetch(
                    "/api/dashboard/customer/wishlist?page=" +
                        currentPage +
                        "&limit=10",
                );

                if (!ok) {
                    listErrorEl.textContent = errorMessage(
                        body,
                        "Could not load your wishlist.",
                    );
                    return;
                }

                const { items, pagination } = body.data;
                renderWishlist(items);

                document.getElementById("pageIndicator").textContent =
                    "Page " +
                    pagination.page +
                    " of " +
                    (pagination.totalPages || 1);
                document.getElementById("prevPageBtn").disabled =
                    !pagination.hasPrev;
                document.getElementById("nextPageBtn").disabled =
                    !pagination.hasNext;
            }

            async function removeFromWishlist(cid) {
                const listErrorEl = document.getElementById("listError");
                listErrorEl.textContent = "";

                const { ok, body } = await apiFetch(
                    "/api/dashboard/customer/wishlist/" + cid,
                    { method: "DELETE" },
                );

                if (!ok) {
                    listErrorEl.textContent = errorMessage(
                        body,
                        "Could not remove that vehicle.",
                    );
                    return;
                }

                await loadWishlist();
            }

            async function checkSession() {
                const { ok, body } = await apiFetch("/api/auth/me");

                if (!ok) {
                    showGuestView();
                    return;
                }

                currentUser = body.data;

                if (currentUser.role !== "customer") {
                    document.getElementById("status").textContent =
                        "Wishlist is for customer accounts only.";
                    document.getElementById("guestView").hidden = false;
                    document.getElementById("customerView").hidden = true;
                    document.getElementById("guestView").innerHTML =
                        '<div class="panel"><p>Wishlist is for customer accounts. You are signed in as an admin.</p></div>';
                    return;
                }

                showCustomerView(currentUser);
                await loadWishlist();
            }

            document
                .getElementById("addWishlistBtn")
                .addEventListener("click", async () => {
                    const addErrorEl = document.getElementById("addError");
                    const addSuccessEl = document.getElementById("addSuccess");
                    addErrorEl.textContent = "";
                    addSuccessEl.textContent = "";

                    const cid = document.getElementById("addCid").value;
                    if (!cid) {
                        addErrorEl.textContent = "Enter a catalog item ID.";
                        return;
                    }

                    const { ok, body } = await apiFetch(
                        "/api/dashboard/customer/wishlist",
                        {
                            method: "POST",
                            body: JSON.stringify({ cid: Number(cid) }),
                        },
                    );

                    if (!ok) {
                        addErrorEl.textContent = errorMessage(
                            body,
                            "Could not add that vehicle.",
                        );
                        return;
                    }

                    addSuccessEl.textContent =
                        "Vehicle #" + cid + " added to your wishlist.";
                    document.getElementById("addCid").value = "";
                    currentPage = 1;
                    await loadWishlist();
                });

            document
                .getElementById("prevPageBtn")
                .addEventListener("click", () => {
                    if (currentPage > 1) {
                        currentPage -= 1;
                        loadWishlist();
                    }
                });

            document
                .getElementById("nextPageBtn")
                .addEventListener("click", () => {
                    currentPage += 1;
                    loadWishlist();
                });

            checkSession();
        </script>
        <script>
            (function () {
                const backBtn = document.getElementById("histBack");
                const forwardBtn = document.getElementById("histForward");
                if (!backBtn || !forwardBtn) return;

                function syncNav() {
                    backBtn.disabled = window.history.length <= 1;
                }

                let canForward = false;
                forwardBtn.disabled = true;

                backBtn.addEventListener("click", function () {
                    canForward = true;
                    forwardBtn.disabled = false;
                    window.history.back();
                });
                forwardBtn.addEventListener("click", function () {
                    if (!canForward) return;
                    window.history.forward();
                });
                window.addEventListener("pageshow", syncNav);
                syncNav();
            })();
        </script>
    </body>
</html>
