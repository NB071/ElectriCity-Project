<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ElectriCity Account</title>
        <style>
            body {
                font-family: sans-serif;
                max-width: 640px;
                margin: 2rem auto;
                padding: 0 1rem;
            }
            h1 {
                margin-bottom: 0.25rem;
            }
            #status {
                color: #555;
                margin-top: 0;
            }
            .panel {
                border: 1px solid #ccc;
                border-radius: 6px;
                padding: 1rem 1.25rem;
                margin-bottom: 1.25rem;
            }
            .panel.danger {
                border-color: #c33;
            }
            .panel h2 {
                margin-top: 0;
                font-size: 1.1rem;
            }
            label {
                display: block;
                margin: 0.6rem 0;
            }
            label input {
                display: block;
                width: 100%;
                box-sizing: border-box;
                margin-top: 0.25rem;
                padding: 0.4rem;
            }
            button {
                margin-top: 0.75rem;
                padding: 0.45rem 0.9rem;
                cursor: pointer;
            }
            button + button {
                margin-left: 0.5rem;
            }
            .error {
                color: #c33;
                white-space: pre-wrap;
            }
            .success {
                color: #2a7a2a;
            }
            #sessionsList {
                list-style: none;
                padding: 0;
            }
            #sessionsList li {
                border-bottom: 1px solid #eee;
                padding: 0.5rem 0;
            }
            #sessionsList li:last-child {
                border-bottom: none;
            }
            #sessionsList .current {
                font-weight: bold;
            }
            [hidden] {
                display: none !important;
            }
        </style>
    </head>
    <body>
        <h1>ElectriCity Account</h1>
        <p id="status">Checking session…</p>

        <section id="guestView" hidden>
            <div class="panel">
                <h2>Sign In</h2>
                <form id="loginForm">
                    <label
                        >Email
                        <input type="email" id="loginEmail" required
                    /></label>
                    <label
                        >Password
                        <input
                            type="password"
                            id="loginPassword"
                            required
                    /></label>
                    <button type="submit">Sign In</button>
                </form>
                <p class="success" id="loginSuccess"></p>
                <p class="error" id="loginError"></p>
            </div>

            <div class="panel">
                <h2>Register</h2>
                <form id="registerForm">
                    <label
                        >First name
                        <input type="text" id="regFirstName" required
                    /></label>
                    <label
                        >Last name
                        <input type="text" id="regLastName" required
                    /></label>
                    <label
                        >Email
                        <input type="email" id="regEmail" required
                    /></label>
                    <label
                        >Phone (optional)
                        <input type="tel" id="regPhone"
                    /></label>
                    <label
                        >Password
                        <input
                            type="password"
                            id="regPassword"
                            required
                    /></label>
                    <button type="submit">Create Account</button>
                </form>
                <p class="success" id="registerSuccess"></p>
                <p class="error" id="registerError"></p>
            </div>
        </section>

        <section id="accountView" hidden>
            <div class="panel">
                <h2>Profile</h2>
                <form id="profileForm">
                    <label
                        >First name
                        <input type="text" id="pFirstName"
                    /></label>
                    <label
                        >Last name
                        <input type="text" id="pLastName"
                    /></label>
                    <label
                        >Email
                        <input type="email" id="pEmail"
                    /></label>
                    <label
                        >Phone
                        <input type="tel" id="pPhone"
                    /></label>
                    <hr />
                    <label
                        >Current password (only needed to change password)
                        <input type="password" id="pCurrentPassword"
                    /></label>
                    <label
                        >New password (leave blank to keep current password)
                        <input type="password" id="pNewPassword"
                    /></label>
                    <button type="submit">Save Changes</button>
                </form>
                <p class="success" id="profileSuccess"></p>
                <p class="error" id="profileError"></p>
            </div>

            <div class="panel">
                <h2>Active Sessions</h2>
                <ul id="sessionsList"></ul>
                <button type="button" id="refreshSessionsBtn">
                    Refresh List
                </button>
            </div>

            <div class="panel">
                <h2>Session</h2>
                <button type="button" id="signOutBtn">Sign Out</button>
                <button type="button" id="signOutAllBtn">
                    Sign Out of All Devices
                </button>
            </div>

            <div class="panel danger">
                <h2>Delete Account</h2>
                <label
                    >Current password
                    <input type="password" id="deleteCurrentPassword"
                /></label>
                <button type="button" id="deleteAccountBtn">
                    Delete My Account
                </button>
                <p class="error" id="deleteError"></p>
            </div>
        </section>

        <script>
            const apiBase = window.location.origin.replace(/\/$/, "");

            const statusEl = document.getElementById("status");
            const guestViewEl = document.getElementById("guestView");
            const accountViewEl = document.getElementById("accountView");

            /**
             * Fetch wrapper that always sends cookies, and silently retries once
             * via /api/auth/refresh if the access token has expired.
             */
            async function apiFetch(path, options = {}) {
                const opts = {
                    credentials: "same-origin",
                    headers: {
                        "Content-Type": "application/json",
                        ...(options.headers || {}),
                    },
                    ...options,
                };

                let res = await fetch(apiBase + path, opts);

                if (
                    res.status === 401 &&
                    path !== "/api/auth/login" &&
                    path !== "/api/auth/refresh"
                ) {
                    const refreshRes = await fetch(
                        apiBase + "/api/auth/refresh",
                        { method: "POST", credentials: "same-origin" },
                    );
                    if (refreshRes.ok) {
                        res = await fetch(apiBase + path, opts);
                    }
                }

                const body = await res.json().catch(() => null);
                return { ok: res.ok, status: res.status, body };
            }

            function errorMessage(body, fallback) {
                return body?.data?.message || fallback;
            }

            function formatDate(value) {
                if (!value) return "unknown";
                return new Date(value).toLocaleString();
            }

            function showGuestView() {
                statusEl.textContent = "Not signed in.";
                guestViewEl.hidden = false;
                accountViewEl.hidden = true;
            }

            function fillProfileForm(user) {
                document.getElementById("pFirstName").value =
                    user.first_name || "";
                document.getElementById("pLastName").value =
                    user.last_name || "";
                document.getElementById("pEmail").value = user.email || "";
                document.getElementById("pPhone").value =
                    user.phone_number || "";
                document.getElementById("pCurrentPassword").value = "";
                document.getElementById("pNewPassword").value = "";
            }

            function renderSessions(sessions) {
                const listEl = document.getElementById("sessionsList");
                listEl.innerHTML = "";

                if (!sessions || sessions.length === 0) {
                    const li = document.createElement("li");
                    li.textContent = "No active sessions.";
                    listEl.appendChild(li);
                    return;
                }

                for (const session of sessions) {
                    const li = document.createElement("li");
                    if (session.is_current) li.classList.add("current");
                    li.textContent =
                        (session.device_label || "Unknown device") +
                        (session.is_current ? " (this device)" : "") +
                        " — " +
                        (session.ip_address || "unknown IP") +
                        " — last seen " +
                        formatDate(session.last_seen_at);
                    listEl.appendChild(li);
                }
            }

            async function loadSessions() {
                const { ok, body } = await apiFetch("/api/auth/me/sessions");
                if (ok) {
                    renderSessions(body.data.sessions);
                }
            }

            async function showAccountView(user) {
                statusEl.textContent = "Signed in as " + user.email;
                guestViewEl.hidden = true;
                accountViewEl.hidden = false;
                fillProfileForm(user);
                await loadSessions();
            }

            async function checkSession() {
                const { ok, body } = await apiFetch("/api/auth/me");
                if (ok) {
                    await showAccountView(body.data);
                } else {
                    showGuestView();
                }
            }

            // ------- Sign in -------
            document
                .getElementById("loginForm")
                .addEventListener("submit", async (event) => {
                    event.preventDefault();
                    const loginErrorEl = document.getElementById("loginError");
                    const loginSuccessEl =
                        document.getElementById("loginSuccess");
                    loginErrorEl.textContent = "";
                    loginSuccessEl.textContent = "";

                    const email = document.getElementById("loginEmail").value;
                    const password =
                        document.getElementById("loginPassword").value;

                    const { ok, body } = await apiFetch("/api/auth/login", {
                        method: "POST",
                        body: JSON.stringify({ email, password }),
                    });

                    if (!ok) {
                        loginErrorEl.textContent = errorMessage(
                            body,
                            "Sign in failed. Please try again.",
                        );
                        return;
                    }

                    const movedItems = body.data.cart_merge?.moved_items || 0;
                    if (movedItems > 0) {
                        loginSuccessEl.textContent =
                            "Merged " +
                            movedItems +
                            " item(s) from your guest cart.";
                    }

                    await showAccountView(body.data.user);
                });

            // ------- Register -------
            document
                .getElementById("registerForm")
                .addEventListener("submit", async (event) => {
                    event.preventDefault();
                    const registerErrorEl =
                        document.getElementById("registerError");
                    const registerSuccessEl = document.getElementById(
                        "registerSuccess",
                    );
                    registerErrorEl.textContent = "";
                    registerSuccessEl.textContent = "";

                    const payload = {
                        first_name:
                            document.getElementById("regFirstName").value,
                        last_name:
                            document.getElementById("regLastName").value,
                        email: document.getElementById("regEmail").value,
                        password: document.getElementById("regPassword")
                            .value,
                        phone_number:
                            document.getElementById("regPhone").value || null,
                    };

                    const { ok, body } = await apiFetch(
                        "/api/auth/register",
                        {
                            method: "POST",
                            body: JSON.stringify(payload),
                        },
                    );

                    if (!ok) {
                        registerErrorEl.textContent = errorMessage(
                            body,
                            "Registration failed. Please try again.",
                        );
                        return;
                    }

                    registerSuccessEl.textContent =
                        "Account created! You can now sign in below.";
                    document.getElementById("registerForm").reset();
                });

            // ------- Update profile -------
            document
                .getElementById("profileForm")
                .addEventListener("submit", async (event) => {
                    event.preventDefault();
                    const profileErrorEl =
                        document.getElementById("profileError");
                    const profileSuccessEl =
                        document.getElementById("profileSuccess");
                    profileErrorEl.textContent = "";
                    profileSuccessEl.textContent = "";

                    const newPassword =
                        document.getElementById("pNewPassword").value;

                    const payload = {
                        first_name: document.getElementById("pFirstName")
                            .value,
                        last_name:
                            document.getElementById("pLastName").value,
                        email: document.getElementById("pEmail").value,
                        phone_number:
                            document.getElementById("pPhone").value || null,
                    };

                    if (newPassword) {
                        payload.current_password = document.getElementById(
                            "pCurrentPassword",
                        ).value;
                        payload.new_password = newPassword;
                    }

                    const { ok, body } = await apiFetch("/api/auth/me", {
                        method: "PATCH",
                        body: JSON.stringify(payload),
                    });

                    if (!ok) {
                        profileErrorEl.textContent = errorMessage(
                            body,
                            "Could not update profile.",
                        );
                        return;
                    }

                    profileSuccessEl.textContent = "Profile updated.";
                    fillProfileForm(body.data);
                });

            // ------- Sessions -------
            document
                .getElementById("refreshSessionsBtn")
                .addEventListener("click", loadSessions);

            // ------- Sign out -------
            document
                .getElementById("signOutBtn")
                .addEventListener("click", async () => {
                    await apiFetch("/api/auth/logout", { method: "POST" });
                    await checkSession();
                });

            document
                .getElementById("signOutAllBtn")
                .addEventListener("click", async () => {
                    await apiFetch("/api/auth/logout-all", {
                        method: "POST",
                    });
                    await checkSession();
                });

            // ------- Delete account -------
            document
                .getElementById("deleteAccountBtn")
                .addEventListener("click", async () => {
                    const deleteErrorEl = document.getElementById(
                        "deleteError",
                    );
                    deleteErrorEl.textContent = "";

                    const current_password = document.getElementById(
                        "deleteCurrentPassword",
                    ).value;

                    if (!current_password) {
                        deleteErrorEl.textContent =
                            "Enter your current password to confirm.";
                        return;
                    }

                    if (
                        !confirm(
                            "Are you sure you want to permanently delete your account?",
                        )
                    ) {
                        return;
                    }

                    const { ok, body } = await apiFetch("/api/auth/me", {
                        method: "DELETE",
                        body: JSON.stringify({ current_password }),
                    });

                    if (!ok) {
                        deleteErrorEl.textContent = errorMessage(
                            body,
                            "Could not delete account.",
                        );
                        return;
                    }

                    await checkSession();
                });

            checkSession();
        </script>
    </body>
</html>
