<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <title>ElectriCity Account</title>
        <link
            rel="stylesheet"
            href="/site.css"
        />
    </head>
    <body>
        <nav
            class="history-nav"
            aria-label="Browser history"
        >
            <button
                type="button"
                id="histBack"
            >
                &lt; Back
            </button>
            <button
                type="button"
                id="histForward"
            >
                &gt; Forward
            </button>
        </nav>
        <h1>ElectriCity Account</h1>
        <p id="status">Checking session...</p>

        <section
            id="guestView"
            hidden
        >
            <div class="panel">
                <h2>Sign In</h2>
                <form id="loginForm">
                    <label
                        >Email
                        <input
                            type="email"
                            id="loginEmail"
                            required
                    /></label>
                    <label
                        >Password
                        <input
                            type="password"
                            id="loginPassword"
                            required
                    /></label>
                    <button type="submit">Sign In</button>
                </form>
                <p
                    class="success"
                    id="loginSuccess"
                ></p>
                <p
                    class="error"
                    id="loginError"
                ></p>
            </div>

            <div class="panel">
                <h2>Register</h2>
                <form id="registerForm">
                    <label
                        >First name
                        <input
                            type="text"
                            id="regFirstName"
                            required
                    /></label>
                    <label
                        >Last name
                        <input
                            type="text"
                            id="regLastName"
                            required
                    /></label>
                    <label
                        >Email
                        <input
                            type="email"
                            id="regEmail"
                            required
                    /></label>
                    <label
                        >Phone (optional)
                        <input
                            type="tel"
                            id="regPhone"
                    /></label>
                    <label
                        >Password
                        <input
                            type="password"
                            id="regPassword"
                            required
                    /></label>
                    <button type="submit">Create Account</button>
                </form>
                <p
                    class="success"
                    id="registerSuccess"
                ></p>
                <p
                    class="error"
                    id="registerError"
                ></p>
            </div>
        </section>

        <section
            id="accountView"
            hidden
        >
            <div class="panel">
                <h2>Profile</h2>
                <form id="profileForm">
                    <label
                        >First name
                        <input
                            type="text"
                            id="pFirstName"
                    /></label>
                    <label
                        >Last name
                        <input
                            type="text"
                            id="pLastName"
                    /></label>
                    <label
                        >Email
                        <input
                            type="email"
                            id="pEmail"
                    /></label>
                    <label
                        >Phone
                        <input
                            type="tel"
                            id="pPhone"
                    /></label>
                    <hr />
                    <label
                        >Current password (only needed to change password)
                        <input
                            type="password"
                            id="pCurrentPassword"
                    /></label>
                    <label
                        >New password (leave blank to keep current password)
                        <input
                            type="password"
                            id="pNewPassword"
                    /></label>
                    <button type="submit">Save Changes</button>
                </form>
                <p
                    class="success"
                    id="profileSuccess"
                ></p>
                <p
                    class="error"
                    id="profileError"
                ></p>
            </div>

            <div class="panel">
                <h2>Saved Addresses</h2>
                <div id="addressesList"></div>
                <p
                    class="error"
                    id="addressesListError"
                ></p>

                <h3 id="addressFormTitle">Add address</h3>
                <form id="addressForm">
                    <input
                        type="hidden"
                        id="addrEditId"
                        value=""
                    />
                    <label
                        >Street
                        <input
                            type="text"
                            id="addrStreet"
                            required
                    /></label>
                    <label
                        >City
                        <input
                            type="text"
                            id="addrCity"
                            required
                    /></label>
                    <label
                        >Province/Territory
                        <select
                            id="addrProvince"
                            required
                        >
                            <option value="ON">Ontario (ON)</option>
                            <option value="BC">British Columbia (BC)</option>
                            <option value="AB">Alberta (AB)</option>
                            <option value="MB">Manitoba (MB)</option>
                            <option value="NB">New Brunswick (NB)</option>
                            <option value="NL">
                                Newfoundland and Labrador (NL)
                            </option>
                            <option value="NS">Nova Scotia (NS)</option>
                            <option value="NT">
                                Northwest Territories (NT)
                            </option>
                            <option value="NU">Nunavut (NU)</option>
                            <option value="PE">
                                Prince Edward Island (PE)
                            </option>
                            <option value="QC">Quebec (QC)</option>
                            <option value="SK">Saskatchewan (SK)</option>
                            <option value="YT">Yukon (YT)</option>
                        </select>
                    </label>
                    <label
                        >Country
                        <input
                            type="text"
                            id="addrCountry"
                            value="Canada"
                            required
                    /></label>
                    <label
                        >Postal code
                        <input
                            type="text"
                            id="addrPostalCode"
                            required
                    /></label>
                    <label
                        ><input
                            type="checkbox"
                            id="addrIsDefault"
                        />
                        Set as default address</label
                    >
                    <button
                        type="submit"
                        id="addrSubmitBtn"
                    >
                        Add Address
                    </button>
                    <button
                        type="button"
                        id="addrCancelEditBtn"
                        hidden
                    >
                        Cancel Edit
                    </button>
                </form>
                <p
                    class="success"
                    id="addressSuccess"
                ></p>
                <p
                    class="error"
                    id="addressError"
                ></p>
            </div>

            <div class="panel">
                <h2>Active Sessions</h2>
                <ul id="sessionsList"></ul>
                <button
                    type="button"
                    id="refreshSessionsBtn"
                >
                    Refresh List
                </button>
            </div>

            <div class="panel">
                <h2>Session</h2>
                <button
                    type="button"
                    id="signOutBtn"
                >
                    Sign Out
                </button>
                <button
                    type="button"
                    id="signOutAllBtn"
                >
                    Sign Out of All Devices
                </button>
            </div>

            <div class="panel danger">
                <h2>Delete Account</h2>
                <label
                    >Current password
                    <input
                        type="password"
                        id="deleteCurrentPassword"
                /></label>
                <button
                    type="button"
                    id="deleteAccountBtn"
                >
                    Delete My Account
                </button>
                <p
                    class="error"
                    id="deleteError"
                ></p>
            </div>
        </section>

        <script>
            const isProduction =
                window.location.hostname === "project-electricity.app" ||
                window.location.hostname === "www.project-electricity.app";
            const apiBase = isProduction
                ? "https://api.project-electricity.app"
                : window.location.origin.replace(/\/$/, "");
            const fetchCredentials = isProduction ? "include" : "same-origin";

            const statusEl = document.getElementById("status");
            const guestViewEl = document.getElementById("guestView");
            const accountViewEl = document.getElementById("accountView");

            /**
             * Fetch wrapper that always sends cookies, and silently retries once
             * via /api/auth/refresh if the access token has expired.
             */
            async function apiFetch(path, options = {}) {
                const opts = {
                    credentials: fetchCredentials,
                    headers: {
                        "Content-Type": "application/json",
                        ...(options.headers || {}),
                    },
                    ...options,
                };

                let res = await fetch(apiBase + path, opts);

                if (
                    res.status === 401 &&
                    path !== "/api/auth/login" &&
                    path !== "/api/auth/refresh"
                ) {
                    const refreshRes = await fetch(
                        apiBase + "/api/auth/refresh",
                        { method: "POST", credentials: fetchCredentials },
                    );
                    if (refreshRes.ok) {
                        res = await fetch(apiBase + path, opts);
                    }
                }

                const body = await res.json().catch(() => null);
                return { ok: res.ok, status: res.status, body };
            }

            function errorMessage(body, fallback) {
                return body?.data?.message || fallback;
            }

            function formatDate(value) {
                if (!value) return "unknown";
                return new Date(value).toLocaleString();
            }

            function showGuestView() {
                statusEl.textContent = "Not signed in.";
                guestViewEl.hidden = false;
                accountViewEl.hidden = true;
            }

            function fillProfileForm(user) {
                document.getElementById("pFirstName").value =
                    user.first_name || "";
                document.getElementById("pLastName").value =
                    user.last_name || "";
                document.getElementById("pEmail").value = user.email || "";
                document.getElementById("pPhone").value =
                    user.phone_number || "";
                document.getElementById("pCurrentPassword").value = "";
                document.getElementById("pNewPassword").value = "";
            }

            function renderSessions(sessions) {
                const listEl = document.getElementById("sessionsList");
                listEl.innerHTML = "";

                if (!sessions || sessions.length === 0) {
                    const li = document.createElement("li");
                    li.textContent = "No active sessions.";
                    listEl.appendChild(li);
                    return;
                }

                for (const session of sessions) {
                    const li = document.createElement("li");
                    if (session.is_current) li.classList.add("current");
                    li.textContent =
                        (session.device_label || "Unknown device") +
                        (session.is_current ? " (this device)" : "") +
                        " * " +
                        (session.ip_address || "unknown IP") +
                        " * last seen " +
                        formatDate(session.last_seen_at);
                    listEl.appendChild(li);
                }
            }

            async function loadSessions() {
                const { ok, body } = await apiFetch("/api/auth/me/sessions");
                if (ok) {
                    renderSessions(body.data.sessions);
                }
            }

            function resetAddressForm() {
                document.getElementById("addrEditId").value = "";
                document.getElementById("addressForm").reset();
                document.getElementById("addrCountry").value = "Canada";
                document.getElementById("addrProvince").value = "ON";
                document.getElementById("addressFormTitle").textContent =
                    "Add address";
                document.getElementById("addrSubmitBtn").textContent =
                    "Add Address";
                document.getElementById("addrCancelEditBtn").hidden = true;
            }

            function fillAddressForm(address, rowNumber) {
                document.getElementById("addrEditId").value =
                    address.address_id;
                document.getElementById("addrStreet").value =
                    address.street || "";
                document.getElementById("addrCity").value = address.city || "";
                document.getElementById("addrProvince").value =
                    address.province || "ON";
                document.getElementById("addrCountry").value =
                    address.country || "Canada";
                document.getElementById("addrPostalCode").value =
                    address.postal_code || "";
                document.getElementById("addrIsDefault").checked = Boolean(
                    address.is_default,
                );
                document.getElementById("addressFormTitle").textContent =
                    "Edit address #" + rowNumber;
                document.getElementById("addrSubmitBtn").textContent =
                    "Save Address";
                document.getElementById("addrCancelEditBtn").hidden = false;
            }

            function renderAddresses(items) {
                const listEl = document.getElementById("addressesList");
                listEl.innerHTML = "";

                if (!items || items.length === 0) {
                    listEl.innerHTML = "<p>No saved addresses yet.</p>";
                    return;
                }

                items.forEach((address, index) => {
                    const rowNumber = index + 1;
                    const div = document.createElement("div");
                    div.className = "line";
                    div.innerHTML =
                        "<p><strong>#" +
                        rowNumber +
                        "</strong>" +
                        (address.is_default ? " (default)" : "") +
                        "<br />" +
                        address.street +
                        "<br />" +
                        address.city +
                        ", " +
                        address.province +
                        " " +
                        address.postal_code +
                        "<br />" +
                        address.country +
                        "</p>" +
                        "<p>" +
                        "<button type='button' class='editAddrBtn' data-id='" +
                        address.address_id +
                        "' data-row='" +
                        rowNumber +
                        "'>Edit</button> " +
                        (address.is_default
                            ? ""
                            : "<button type='button' class='defaultAddrBtn' data-id='" +
                              address.address_id +
                              "' data-row='" +
                              rowNumber +
                              "'>Set default</button> ") +
                        "<button type='button' class='deleteAddrBtn' data-id='" +
                        address.address_id +
                        "' data-row='" +
                        rowNumber +
                        "'>Delete</button>" +
                        "</p>";
                    listEl.appendChild(div);
                });

                listEl.querySelectorAll(".editAddrBtn").forEach((btn) => {
                    btn.addEventListener("click", () => {
                        const address = items.find(
                            (item) =>
                                item.address_id === Number(btn.dataset.id),
                        );
                        if (address) {
                            fillAddressForm(address, Number(btn.dataset.row));
                        }
                    });
                });
                listEl.querySelectorAll(".defaultAddrBtn").forEach((btn) => {
                    btn.addEventListener("click", () =>
                        setDefaultAddress(
                            Number(btn.dataset.id),
                            Number(btn.dataset.row),
                        ),
                    );
                });
                listEl.querySelectorAll(".deleteAddrBtn").forEach((btn) => {
                    btn.addEventListener("click", () =>
                        deleteAddress(
                            Number(btn.dataset.id),
                            Number(btn.dataset.row),
                        ),
                    );
                });
            }

            async function loadAddresses() {
                const listErrorEl =
                    document.getElementById("addressesListError");
                listErrorEl.textContent = "";

                const { ok, body } = await apiFetch(
                    "/api/auth/me/addresses?page=1&limit=20",
                );

                if (!ok) {
                    listErrorEl.textContent = errorMessage(
                        body,
                        "Could not load addresses.",
                    );
                    return;
                }

                renderAddresses(body.data.items || []);
            }

            async function setDefaultAddress(addressId, rowNumber) {
                const addressErrorEl = document.getElementById("addressError");
                const addressSuccessEl =
                    document.getElementById("addressSuccess");
                addressErrorEl.textContent = "";
                addressSuccessEl.textContent = "";

                const { ok, body } = await apiFetch(
                    "/api/auth/me/addresses/" + addressId + "/default",
                    { method: "PATCH", body: "{}" },
                );

                if (!ok) {
                    addressErrorEl.textContent = errorMessage(
                        body,
                        "Could not set default address.",
                    );
                    return;
                }

                addressSuccessEl.textContent =
                    "Address #" + rowNumber + " is now your default.";
                resetAddressForm();
                await loadAddresses();
            }

            async function deleteAddress(addressId, rowNumber) {
                if (!window.confirm("Delete address #" + rowNumber + "?")) {
                    return;
                }

                const addressErrorEl = document.getElementById("addressError");
                const addressSuccessEl =
                    document.getElementById("addressSuccess");
                addressErrorEl.textContent = "";
                addressSuccessEl.textContent = "";

                const { ok, body } = await apiFetch(
                    "/api/auth/me/addresses/" + addressId,
                    { method: "DELETE" },
                );

                if (!ok) {
                    addressErrorEl.textContent = errorMessage(
                        body,
                        "Could not delete address.",
                    );
                    return;
                }

                addressSuccessEl.textContent =
                    "Address #" + rowNumber + " deleted.";
                if (
                    document.getElementById("addrEditId").value ===
                    String(addressId)
                ) {
                    resetAddressForm();
                }
                await loadAddresses();
            }

            async function showAccountView(user) {
                statusEl.textContent = "Signed in as " + user.email;
                guestViewEl.hidden = true;
                accountViewEl.hidden = false;
                fillProfileForm(user);
                resetAddressForm();
                await Promise.all([loadSessions(), loadAddresses()]);
            }

            async function checkSession() {
                const { ok, body } = await apiFetch("/api/auth/me");
                if (ok) {
                    await showAccountView(body.data);
                } else {
                    showGuestView();
                }
            }

            // ------- Sign in -------
            document
                .getElementById("loginForm")
                .addEventListener("submit", async (event) => {
                    event.preventDefault();
                    const loginErrorEl = document.getElementById("loginError");
                    const loginSuccessEl =
                        document.getElementById("loginSuccess");
                    loginErrorEl.textContent = "";
                    loginSuccessEl.textContent = "";

                    const email = document.getElementById("loginEmail").value;
                    const password =
                        document.getElementById("loginPassword").value;

                    const { ok, body } = await apiFetch("/api/auth/login", {
                        method: "POST",
                        body: JSON.stringify({ email, password }),
                    });

                    if (!ok) {
                        loginErrorEl.textContent = errorMessage(
                            body,
                            "Sign in failed. Please try again.",
                        );
                        return;
                    }

                    const movedItems = body.data.cart_merge?.moved_items || 0;
                    if (movedItems > 0) {
                        loginSuccessEl.textContent =
                            "Merged " +
                            movedItems +
                            " item(s) from your guest cart.";
                    }

                    await showAccountView(body.data.user);
                });

            // ------- Register -------
            document
                .getElementById("registerForm")
                .addEventListener("submit", async (event) => {
                    event.preventDefault();
                    const registerErrorEl =
                        document.getElementById("registerError");
                    const registerSuccessEl =
                        document.getElementById("registerSuccess");
                    registerErrorEl.textContent = "";
                    registerSuccessEl.textContent = "";

                    const payload = {
                        first_name:
                            document.getElementById("regFirstName").value,
                        last_name: document.getElementById("regLastName").value,
                        email: document.getElementById("regEmail").value,
                        password: document.getElementById("regPassword").value,
                        phone_number:
                            document.getElementById("regPhone").value || null,
                    };

                    const { ok, body } = await apiFetch("/api/auth/register", {
                        method: "POST",
                        body: JSON.stringify(payload),
                    });

                    if (!ok) {
                        registerErrorEl.textContent = errorMessage(
                            body,
                            "Registration failed. Please try again.",
                        );
                        return;
                    }

                    registerSuccessEl.textContent =
                        "Account created! You can now sign in below.";
                    document.getElementById("registerForm").reset();
                });

            // ------- Addresses -------
            document
                .getElementById("addrCancelEditBtn")
                .addEventListener("click", () => {
                    document.getElementById("addressError").textContent = "";
                    document.getElementById("addressSuccess").textContent = "";
                    resetAddressForm();
                });

            document
                .getElementById("addressForm")
                .addEventListener("submit", async (event) => {
                    event.preventDefault();
                    const addressErrorEl =
                        document.getElementById("addressError");
                    const addressSuccessEl =
                        document.getElementById("addressSuccess");
                    addressErrorEl.textContent = "";
                    addressSuccessEl.textContent = "";

                    const editId = document.getElementById("addrEditId").value;
                    const payload = {
                        street: document.getElementById("addrStreet").value,
                        city: document.getElementById("addrCity").value,
                        province: document.getElementById("addrProvince").value,
                        country: document.getElementById("addrCountry").value,
                        postal_code:
                            document.getElementById("addrPostalCode").value,
                        is_default:
                            document.getElementById("addrIsDefault").checked,
                    };

                    const { ok, body } = editId
                        ? await apiFetch("/api/auth/me/addresses/" + editId, {
                              method: "PATCH",
                              body: JSON.stringify(payload),
                          })
                        : await apiFetch("/api/auth/me/addresses", {
                              method: "POST",
                              body: JSON.stringify(payload),
                          });

                    if (!ok) {
                        addressErrorEl.textContent = errorMessage(
                            body,
                            editId
                                ? "Could not update address."
                                : "Could not add address.",
                        );
                        return;
                    }

                    addressSuccessEl.textContent = editId
                        ? "Address updated."
                        : "Address added.";
                    resetAddressForm();
                    await loadAddresses();
                });

            // ------- Update profile -------
            document
                .getElementById("profileForm")
                .addEventListener("submit", async (event) => {
                    event.preventDefault();
                    const profileErrorEl =
                        document.getElementById("profileError");
                    const profileSuccessEl =
                        document.getElementById("profileSuccess");
                    profileErrorEl.textContent = "";
                    profileSuccessEl.textContent = "";

                    const newPassword =
                        document.getElementById("pNewPassword").value;

                    const payload = {
                        first_name: document.getElementById("pFirstName").value,
                        last_name: document.getElementById("pLastName").value,
                        email: document.getElementById("pEmail").value,
                        phone_number:
                            document.getElementById("pPhone").value || null,
                    };

                    if (newPassword) {
                        payload.current_password =
                            document.getElementById("pCurrentPassword").value;
                        payload.new_password = newPassword;
                    }

                    const { ok, body } = await apiFetch("/api/auth/me", {
                        method: "PATCH",
                        body: JSON.stringify(payload),
                    });

                    if (!ok) {
                        profileErrorEl.textContent = errorMessage(
                            body,
                            "Could not update profile.",
                        );
                        return;
                    }

                    profileSuccessEl.textContent = "Profile updated.";
                    fillProfileForm(body.data);
                });

            // ------- Sessions -------
            document
                .getElementById("refreshSessionsBtn")
                .addEventListener("click", loadSessions);

            // ------- Sign out -------
            document
                .getElementById("signOutBtn")
                .addEventListener("click", async () => {
                    await apiFetch("/api/auth/logout", { method: "POST" });
                    await checkSession();
                });

            document
                .getElementById("signOutAllBtn")
                .addEventListener("click", async () => {
                    await apiFetch("/api/auth/logout-all", {
                        method: "POST",
                    });
                    await checkSession();
                });

            // ------- Delete account -------
            document
                .getElementById("deleteAccountBtn")
                .addEventListener("click", async () => {
                    const deleteErrorEl =
                        document.getElementById("deleteError");
                    deleteErrorEl.textContent = "";

                    const current_password = document.getElementById(
                        "deleteCurrentPassword",
                    ).value;

                    if (!current_password) {
                        deleteErrorEl.textContent =
                            "Enter your current password to confirm.";
                        return;
                    }

                    if (
                        !confirm(
                            "Are you sure you want to permanently delete your account?",
                        )
                    ) {
                        return;
                    }

                    const { ok, body } = await apiFetch("/api/auth/me", {
                        method: "DELETE",
                        body: JSON.stringify({ current_password }),
                    });

                    if (!ok) {
                        deleteErrorEl.textContent = errorMessage(
                            body,
                            "Could not delete account.",
                        );
                        return;
                    }

                    await checkSession();
                });

            checkSession();
        </script>
        <script>
            (function () {
                const backBtn = document.getElementById("histBack");
                const forwardBtn = document.getElementById("histForward");
                if (!backBtn || !forwardBtn) return;

                function syncNav() {
                    // history.length does not expose a forward stack; enable Forward
                    // after the user goes back at least once in this page session.
                    backBtn.disabled = window.history.length <= 1;
                }

                let canForward = false;
                forwardBtn.disabled = true;

                backBtn.addEventListener("click", function () {
                    canForward = true;
                    forwardBtn.disabled = false;
                    window.history.back();
                });
                forwardBtn.addEventListener("click", function () {
                    if (!canForward) return;
                    window.history.forward();
                });
                window.addEventListener("pageshow", syncNav);
                syncNav();
            })();
        </script>
    </body>
</html>
