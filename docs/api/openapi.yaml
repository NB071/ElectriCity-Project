openapi: 3.0.3
info:
  title: ElectriCity API
  version: 1.0.0
  description: |-
    HTTP API for the ElectriCity EV marketplace Express backend.

    Every successful and error response uses the same envelope shape: `success`, `status`, `data`, and `timestamp`. On success, `data` holds the payload. On failure, `data` is an error object with `code`, `message`, and optional `details`, `stack`, and `sentry_event_id`.

    Authenticate with the `access_token` httpOnly cookie or an `Authorization: Bearer` JWT. Guest carts use the `X-Cart-Session` header (or matching `cart_session` cookie). Customer and admin dashboard routes require the matching role.
servers:
- url: http://localhost:8080
  description: Local development server
- url: https://api.project-electricity.app
  description: Production API
tags:
- name: Auth
  description: Registration, login, sessions, profile, and saved addresses.
- name: Cart
  description: Guest or customer shopping cart. Admins cannot use cart routes.
- name: Catalog
  description: Public vehicle browse, brands, configurations, and reviews.
- name: Checkout
  description: Tax calculation and order placement for guest or customer carts.
- name: Chatbot
  description: Templated shop assistant replies.
- name: Customer Dashboard
  description: Customer-only orders, payments, wishlist, reviews, and overview.
- name: Admin Dashboard
  description: Admin analytics, orders, payments, reviews, media, and users.
paths:
  /api/auth/register:
    post:
      tags:
      - Auth
      summary: Register a new customer
      description: Creates a customer account and returns the new profile. Tokens are not issued here.
        Sign in afterward to receive auth cookies.
      operationId: authRegister
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/User'
              example:
                success: true
                status: 201 Created
                data:
                  user_id: 12
                  role: customer
                  first_name: Maya
                  last_name: Singh
                  email: maya.singh@example.com
                  phone_number: '4165551001'
                  created_at: '2026-07-30T07:30:00.000Z'
                  updated_at: '2026-07-30T07:30:00.000Z'
                timestamp: '2026-07-30T07:30:00.000Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/login:
    post:
      tags:
      - Auth
      summary: Log in
      description: Validates credentials and sets httpOnly access_token and refresh_token cookies. If
        a guest cart session is present, the server may merge those items into the customer cart and include
        cart_merge in the payload.
      operationId: authLogin
      parameters:
      - name: X-Cart-Session
        in: header
        required: false
        schema:
          type: string
          format: uuid
        description: Optional guest cart session to merge on login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in. Auth cookies are set.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/LoginResponseData'
              example:
                success: true
                status: 200 OK
                data:
                  user:
                    user_id: 12
                    role: customer
                    first_name: Maya
                    last_name: Singh
                    email: maya.singh@example.com
                  cart_merge:
                    merged: true
                    moved_items: 1
                timestamp: '2026-07-30T07:30:00.000Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/refresh:
    post:
      tags:
      - Auth
      summary: Refresh access token
      description: Rotates auth cookies using the refresh_token cookie or an explicit refresh_token body
        field.
      operationId: authRefresh
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Tokens refreshed.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiEnvelope'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        refreshed:
                          type: boolean
              example:
                success: true
                status: 200 OK
                data:
                  refreshed: true
                timestamp: '2026-07-30T07:30:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/logout:
    post:
      tags:
      - Auth
      summary: Log out current session
      description: Revokes the current refresh session and clears auth cookies on this device.
      operationId: authLogout
      security: &id001
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Logged out.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiEnvelope'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        loggedOut:
                          type: boolean
              example:
                success: true
                status: 200 OK
                data:
                  loggedOut: true
                timestamp: '2026-07-30T07:30:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/logout-all:
    post:
      tags:
      - Auth
      summary: Log out all devices
      description: Revokes every refresh session for the user and clears cookies on this request.
      operationId: authLogoutAll
      security: *id001
      responses:
        '200':
          description: All sessions revoked.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiEnvelope'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        loggedOutAllDevices:
                          type: boolean
              example:
                success: true
                status: 200 OK
                data:
                  loggedOutAllDevices: true
                timestamp: '2026-07-30T07:30:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/me/sessions:
    get:
      tags:
      - Auth
      summary: List my sessions
      description: Returns active refresh sessions for the signed-in user. The current session is flagged
        with is_current and sorted first.
      operationId: authListSessions
      security: *id001
      responses:
        '200':
          description: Session list.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiEnvelope'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        sessions:
                          type: array
                          items:
                            type: object
                            properties:
                              session_id:
                                type: string
                                format: uuid
                              device_label:
                                type: string
                                nullable: true
                              ip_address:
                                type: string
                                nullable: true
                              user_agent:
                                type: string
                                nullable: true
                              last_seen_at:
                                type: string
                                format: date-time
                              created_at:
                                type: string
                                format: date-time
                              is_current:
                                type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/me/sessions/{sessionId}:
    delete:
      tags:
      - Auth
      summary: Revoke a session
      description: Revokes another device session. The current session cannot be deleted through this
        endpoint. Use logout instead.
      operationId: authRevokeSession
      security: *id001
      parameters:
      - $ref: '#/components/parameters/SessionIdPath'
      responses:
        '200':
          description: Session revoked.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiEnvelope'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        revoked:
                          type: boolean
              example:
                success: true
                status: 200 OK
                data:
                  revoked: true
                timestamp: '2026-07-30T07:30:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/me:
    get:
      tags:
      - Auth
      summary: Get current user
      description: Optional auth. Guests receive data null. Authenticated callers get their User profile.
        Use fields to request a subset of columns.
      operationId: authGetMe
      security: *id001
      parameters:
      - name: fields
        in: query
        required: false
        description: 'Comma-separated subset: user_id, role, first_name, last_name, email, phone_number,
          created_at, updated_at.'
        schema:
          type: string
          example: email,first_name
      responses:
        '200':
          description: Current user, or null for guests.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiEnvelope'
                - type: object
                  properties:
                    data:
                      nullable: true
                      allOf:
                      - $ref: '#/components/schemas/User'
              examples:
                authenticated:
                  value:
                    success: true
                    status: 200 OK
                    data:
                      user_id: 12
                      role: customer
                      first_name: Maya
                      last_name: Singh
                      email: maya.singh@example.com
                      phone_number: '4165551001'
                      created_at: '2026-01-10T12:00:00.000Z'
                      updated_at: '2026-07-01T09:00:00.000Z'
                    timestamp: '2026-07-30T07:30:00.000Z'
                guest:
                  value:
                    success: true
                    status: 200 OK
                    data: null
                    timestamp: '2026-07-30T07:30:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags:
      - Auth
      summary: Update profile
      description: Updates profile fields for the signed-in user. Supply current_password when setting
        new_password. At least one profile field must change.
      operationId: authUpdateMe
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                email:
                  type: string
                  format: email
                phone_number:
                  type: string
                  nullable: true
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 8
                  maxLength: 128
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
      - Auth
      summary: Delete account
      description: Soft-deletes the signed-in account after verifying current_password.
      operationId: authDeleteMe
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - current_password
              properties:
                current_password:
                  type: string
      responses:
        '200':
          description: Account deleted.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiEnvelope'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        deleted:
                          type: boolean
              example:
                success: true
                status: 200 OK
                data:
                  deleted: true
                timestamp: '2026-07-30T07:30:00.000Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/me/addresses:
    get:
      tags:
      - Auth
      summary: List saved addresses
      description: Returns paginated saved addresses for the signed-in user (max 20 addresses per account).
      operationId: authListAddresses
      security: *id001
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Address page.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiEnvelope'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        items:
                          type: array
                          items:
                            $ref: '#/components/schemas/Address'
                        pagination:
                          $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
      - Auth
      summary: Add saved address
      description: Creates a saved address. Optionally mark it as the default shipping address.
      operationId: authCreateAddress
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressCreateRequest'
      responses:
        '201':
          description: Address created.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Address'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/me/addresses/{addressId}:
    get:
      tags:
      - Auth
      summary: Get saved address
      description: Returns one saved address owned by the signed-in user.
      operationId: authGetAddress
      security: *id001
      parameters:
      - $ref: '#/components/parameters/AddressIdPath'
      responses:
        '200':
          description: Address detail.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Address'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags:
      - Auth
      summary: Update saved address
      description: Patches one or more address fields. At least one field is required.
      operationId: authUpdateAddress
      security: *id001
      parameters:
      - $ref: '#/components/parameters/AddressIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                street:
                  type: string
                city:
                  type: string
                province:
                  type: string
                country:
                  type: string
                postal_code:
                  type: string
                is_default:
                  type: boolean
      responses:
        '200':
          description: Updated address.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Address'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
      - Auth
      summary: Delete saved address
      description: Removes a saved address owned by the signed-in user.
      operationId: authDeleteAddress
      security: *id001
      parameters:
      - $ref: '#/components/parameters/AddressIdPath'
      responses:
        '200':
          description: Address deleted.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiEnvelope'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        address_id:
                          type: integer
              example:
                success: true
                status: 200 OK
                data:
                  address_id: 3
                timestamp: '2026-07-30T07:30:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/me/addresses/{addressId}/default:
    patch:
      tags:
      - Auth
      summary: Set default address
      description: Marks the given address as the user's default and clears the previous default flag.
      operationId: authSetDefaultAddress
      security: *id001
      parameters:
      - $ref: '#/components/parameters/AddressIdPath'
      responses:
        '200':
          description: Default address updated.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Address'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/shop/cart:
    get:
      tags:
      - Cart
      summary: Get cart
      description: Returns the guest or customer cart with paginated line items. Guests must send X-Cart-Session.
        Authenticated admins are rejected.
      operationId: cartGet
      security: &id002
      - cookieAuth: []
      - bearerAuth: []
      - cartSession: []
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - added_at_desc
          - added_at_asc
          - price_asc
          - price_desc
          default: added_at_desc
      responses:
        '200':
          description: Cart contents.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/CartListResponse'
              example:
                success: true
                status: 200 OK
                data:
                  cart_id: 5
                  items:
                  - cart_item_id: 41
                    cid: 24
                    config_id: 8
                    quantity: 1
                    added_at: '2026-07-29T18:00:00.000Z'
                    unit_price: 51500
                    line_total: 51500
                    catalog_item:
                      cid: 24
                      item_type: vehicle
                      name: Toyota bZ4X
                      base_price: 50000
                      stock: 5
                      is_active: true
                      primary_image_url: /media/vehicles/Toyota bZ4X 2026/ext.jpg
                      promotions: []
                    configuration:
                      config_id: 8
                      total_price: 51500
                      created_at: '2026-07-29T17:55:00.000Z'
                      options:
                      - category_id: 1
                        category_name: Paint
                        select_type: SINGLE
                        option_id: 2
                        name: Solid Black
                        price_delta: 1500
                  pagination:
                    page: 1
                    limit: 5
                    total: 1
                    totalPages: 1
                    hasNext: false
                    hasPrev: false
                  sort: added_at_desc
                  session_token: null
                  is_guest: false
                timestamp: '2026-07-30T07:30:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
      - Cart
      summary: Clear cart
      description: Removes every item from the current guest or customer cart.
      operationId: cartClear
      security: *id002
      responses:
        '200':
          description: Cart cleared.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiEnvelope'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        cleared:
                          type: boolean
                        session_token:
                          type: string
                          nullable: true
                        is_guest:
                          type: boolean
              example:
                success: true
                status: 200 OK
                data:
                  cleared: true
                  session_token: null
                  is_guest: false
                timestamp: '2026-07-30T07:30:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/shop/cart/summary:
    get:
      tags:
      - Cart
      summary: Cart summary
      description: Lightweight cart preview for headers and drawers. Preview limit defaults to 5 and is
        capped at 10.
      operationId: cartSummary
      security: *id002
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 10
          default: 5
      responses:
        '200':
          description: Cart summary.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/CartSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/shop/cart/items:
    post:
      tags:
      - Cart
      summary: Add cart item
      description: Adds a catalog item (optionally with a saved configuration) to the guest or customer
        cart.
      operationId: cartAddItem
      security: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCartItemRequest'
      responses:
        '200':
          description: Item added or quantity updated.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/CartItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/shop/cart/items/{cartItemId}:
    patch:
      tags:
      - Cart
      summary: Update cart item quantity
      description: Sets quantity for an existing cart line (1-99).
      operationId: cartUpdateItem
      security: *id002
      parameters:
      - $ref: '#/components/parameters/CartItemIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - quantity
              properties:
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 99
                  example: 2
      responses:
        '200':
          description: Updated cart item.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/CartItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
      - Cart
      summary: Remove cart item
      description: Deletes a single line from the guest or customer cart.
