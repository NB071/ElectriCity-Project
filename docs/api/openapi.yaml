components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: httpOnly JWT access cookie set by login or refresh.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Authorization Bearer JWT. Alternative to the access_token cookie.
    cartSession:
      type: apiKey
      in: header
      name: X-Cart-Session
      description: Guest cart session UUID (36 characters). Also accepted as cart_session cookie.
  parameters:
    PageParam:
      name: page
      in: query
      required: false
      description: Page number (1-based). Defaults to 1.
      schema:
        type: integer
        minimum: 1
        default: 1
        example: 1
    LimitParam:
      name: limit
      in: query
      required: false
      description: Items per page. Defaults to 5. Maximum 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 5
        example: 5
    SessionIdPath:
      name: sessionId
      in: path
      required: true
      description: Refresh session UUID to revoke.
      schema:
        type: string
        format: uuid
    AddressIdPath:
      name: addressId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    CartItemIdPath:
      name: cartItemId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    BrandIdPath:
      name: brandId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    CidPath:
      name: cid
      in: path
      required: true
      description: Catalog item id.
      schema:
        type: integer
        minimum: 1
    ConfigIdPath:
      name: configId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    OrderIdPath:
      name: orderId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    EventTypeIdPath:
      name: eventTypeId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    EventIdPath:
      name: eventId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    AttemptIdPath:
      name: attemptId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ReviewIdPath:
      name: rid
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    MediaIdPath:
      name: mediaId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    AnalyticsStart:
      name: start
      in: query
      required: false
      description: Inclusive start date (YYYY-MM-DD). Defaults to 30 days ago.
      schema:
        type: string
        format: date
    AnalyticsEnd:
      name: end
      in: query
      required: false
      description: Inclusive end date (YYYY-MM-DD). Defaults to today. Max range 366 days.
      schema:
        type: string
        format: date
  schemas:
    ApiEnvelope:
      type: object
      description: Universal response wrapper. Every endpoint returns this shape.
      required:
      - success
      - status
      - data
      - timestamp
      properties:
        success:
          type: boolean
          description: True for successful handlers, false for errors.
        status:
          type: string
          description: HTTP status text such as '200 OK' or '404 Not Found'.
          example: 200 OK
        data:
          description: Payload on success, or ApiErrorBody on failure. May be null (for example GET /api/auth/me
            as a guest).
          nullable: true
        timestamp:
          type: string
          format: date-time
          description: ISO-8601 response time from the server.
    ApiErrorBody:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Machine-readable error code.
          enum:
          - VALIDATION_ERROR
          - UNAUTHORIZED
          - FORBIDDEN
          - NOT_FOUND
          - CONFLICT
          - RATE_LIMITED
          - DATABASE_ERROR
          - INTERNAL_ERROR
          - PAYMENT_ERROR
        message:
          type: string
        details:
          nullable: true
          description: Validation issues or extra context. Suppressed for 5xx in production.
        stack:
          type: string
          nullable: true
          description: Stack trace in non-production environments only.
        sentry_event_id:
          type: string
          nullable: true
          description: Sentry event id when error reporting is enabled.
    PaginationMeta:
      type: object
      required:
      - page
      - limit
      - total
      - totalPages
      - hasNext
      - hasPrev
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 5
        total:
          type: integer
          example: 24
        totalPages:
          type: integer
          example: 5
        hasNext:
          type: boolean
          example: true
        hasPrev:
          type: boolean
          example: false
    PaginatedItems:
      type: object
      description: Common list payload with items plus pagination meta.
      required:
      - items
      - pagination
      properties:
        items:
          type: array
          items: {}
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
    User:
      type: object
      properties:
        user_id:
          type: integer
          example: 12
        role:
          type: string
          enum:
          - customer
          - admin
          example: customer
        first_name:
          type: string
          example: Maya
        last_name:
          type: string
          example: Singh
        email:
          type: string
          format: email
          example: maya.singh@example.com
        phone_number:
          type: string
          nullable: true
          example: '4165551001'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Address:
      type: object
      properties:
        address_id:
          type: integer
          example: 3
        street:
          type: string
          example: 100 Queen St W
        city:
          type: string
          example: Toronto
        province:
          type: string
          example: 'ON'
        country:
          type: string
          example: Canada
        postal_code:
          type: string
          example: M5H2N2
        is_default:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Promotion:
      type: object
      properties:
        promo_id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        discount_amount:
          type: number
    CartCatalogItem:
      type: object
      properties:
        cid:
          type: integer
          example: 24
        item_type:
          type: string
          example: vehicle
        name:
          type: string
          example: Toyota bZ4X
        base_price:
          type: number
          example: 50000
        stock:
          type: integer
          example: 5
        is_active:
          type: boolean
          example: true
        primary_image_url:
          type: string
          nullable: true
          example: /media/vehicles/Toyota bZ4X 2026/ext.jpg
        promotions:
          type: array
          items:
            $ref: '#/components/schemas/Promotion'
    CartConfigurationOption:
      type: object
      properties:
        category_id:
          type: integer
        category_name:
          type: string
        select_type:
          type: string
        option_id:
          type: integer
        name:
          type: string
        price_delta:
          type: number
    CartConfiguration:
      type: object
      nullable: true
      properties:
        config_id:
          type: integer
          example: 8
        total_price:
          type: number
          example: 51500
        created_at:
          type: string
          format: date-time
        options:
          type: array
          items:
            $ref: '#/components/schemas/CartConfigurationOption'
    CartItem:
      type: object
      properties:
        cart_item_id:
          type: integer
          example: 41
        cid:
          type: integer
          example: 24
        config_id:
          type: integer
          nullable: true
          example: 8
        quantity:
          type: integer
          example: 1
        added_at:
          type: string
          format: date-time
        unit_price:
          type: number
          example: 51500
        line_total:
          type: number
          example: 51500
        catalog_item:
          $ref: '#/components/schemas/CartCatalogItem'
        configuration:
          $ref: '#/components/schemas/CartConfiguration'
        session_token:
          type: string
          nullable: true
        is_guest:
          type: boolean
    CheckoutAddress:
      type: object
      required:
      - full_name
      - street
      - city
      - province
      - country
      - postal_code
      properties:
        address_type:
          type: string
          enum:
          - shipping
          - billing
          example: shipping
        full_name:
          type: string
          example: Maya Singh
        phone_number:
          type: string
          nullable: true
          example: '4165551001'
        street:
          type: string
          example: 100 Queen St W
        city:
          type: string
          example: Toronto
        province:
          type: string
          description: Canadian province code or name. Normalized to a two-letter code.
          example: 'ON'
        country:
          type: string
          example: Canada
        postal_code:
          type: string
          example: M5H2N2
    CheckoutLineItem:
      type: object
      properties:
        cid:
          type: integer
          example: 24
        config_id:
          type: integer
          nullable: true
          example: 8
        name:
          type: string
          example: Toyota bZ4X
        quantity:
          type: integer
          example: 1
        unit_price:
          type: number
          example: 51500
        line_total:
          type: number
          example: 51500
    CheckoutCalculateLineItem:
      type: object
      properties:
        cid:
          type: integer
          example: 24
        config_id:
          type: integer
          nullable: true
          example: 8
        quantity:
          type: integer
          example: 1
