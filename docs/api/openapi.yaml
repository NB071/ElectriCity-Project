              type: number
              example: 0
            hst:
              type: number
              example: 0.13
            applicable:
              type: number
              example: 0.13
        amounts:
          type: object
          properties:
            gst:
              type: number
              example: 0
            pst:
              type: number
              example: 0
            hst:
              type: number
              example: 6695
            tax:
              type: number
              example: 6695
    CheckoutCalculateResponse:
      type: object
      properties:
        currency:
          type: string
          example: CAD
        province:
          type: string
          example: 'ON'
        tax_rate:
          type: number
          example: 0.13
        subtotal:
          type: number
          example: 51500
        tax:
          type: number
          example: 6695
        total:
          type: number
          example: 58195
        tax_breakdown:
          $ref: '#/components/schemas/TaxBreakdown'
        items:
          type: array
          items:
            $ref: '#/components/schemas/CheckoutCalculateLineItem'
    CheckoutResult:
      type: object
      properties:
        order_id:
          type: integer
          example: 77
        order_status:
          type: string
          example: pending
        payment_status:
          type: string
          example: paid
        subtotal:
          type: number
          example: 51500
        tax:
          type: number
          example: 6695
        total:
          type: number
          example: 58195
        payment:
          type: object
          properties:
            attempt_id:
              type: integer
              example: 90
            status:
              type: string
              enum:
